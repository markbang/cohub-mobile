name: Native CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  EXPO_NO_TELEMETRY: "1"

jobs:
  android:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Node
        id: node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # file: dependencies (modules/*) install as symlinks into the checkout, so the cache holds
      # only the links; their package.json files are in the key for the dependencies they declare.
      # The vendored Markdown renderer's postinstall downloads native sources into its checkout
      # folder; they are cached alongside, as both native builds and the OTA fingerprint read them.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            modules/react-native-enriched-markdown/cpp/highlight/vendor/grammars
            modules/react-native-enriched-markdown/cpp/highlight/vendor/tree-sitter
            modules/react-native-enriched-markdown/ios/vendor
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json', 'modules/*/package.json', 'modules/react-native-enriched-markdown/*.mjs', 'modules/react-native-enriched-markdown/ratex-version.json', 'modules/react-native-enriched-markdown/cpp/highlight/grammar-versions.json') }}

      # The postinstall only warns when a download fails; an incomplete set is never cached.
      - name: Install dependencies
        id: npm-ci
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: |
          npm ci
          vendor=modules/react-native-enriched-markdown
          if [ -f "$vendor/cpp/highlight/vendor/grammars/.stamp" ] && [ -f "$vendor/cpp/highlight/vendor/tree-sitter/.stamp" ] && [ -f "$vendor/ios/vendor/.stamp" ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          fi

      # Saved before anything else runs: later steps write build output into node_modules.
      - name: Save node_modules
        if: steps.npm-ci.outputs.complete == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            node_modules
            modules/react-native-enriched-markdown/cpp/highlight/vendor/grammars
            modules/react-native-enriched-markdown/cpp/highlight/vendor/tree-sitter
            modules/react-native-enriched-markdown/ios/vendor
          key: ${{ steps.node-modules.outputs.cache-primary-key }}

      # sandboxd, the device Runtime's file bridge, is built from the pinned reference/cohub submodule.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: reference/cohub/apps/sandbox/go.mod
          cache-dependency-path: reference/cohub/apps/sandbox/go.sum

      - name: Generate Android project
        run: npm run native:android:prepare

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # setup-java hashes the prebuild-generated android/*.gradle files into its cache key
      # and never falls back to an older entry, so every app version or config bump starts
      # cold (~4 minutes of re-downloaded dependencies and artifact transforms). The Gradle
      # caches only depend on the committed dependency set, which changes far less often.
      - name: Restore Gradle caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/build-cache-1
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ccache serves the NDK/CMake compiles that dominate the build (React Native's own CMake
      # also finds it; the doubled launcher is harmless). Gradle installs the NDK on every run, so
      # ccache identifies the compiler by content, not mtime. Gradle's build cache serves the Kotlin
      # and Java tasks. Both restore the newest entry for this build variant and save every run.
      - name: Set up native build caches
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache
          mkdir -p ~/.gradle
          echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties
          {
            echo "CCACHE_DIR=$HOME/.ccache"
            echo "CCACHE_MAXSIZE=1G"
            echo "CCACHE_COMPILERCHECK=content"
            echo "CCACHE_SLOPPINESS=include_file_ctime,include_file_mtime,time_macros"
            echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
          } >> "$GITHUB_ENV"

      - name: Restore native build caches
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.ccache
            ~/.gradle/caches/build-cache-1
          key: android-build-${{ runner.os }}-debug-${{ github.run_id }}
          restore-keys: |
            android-build-${{ runner.os }}-debug-

      - name: Compile debug APKs
        env:
          COHUB_ANDROID_ARCHITECTURES: armeabi-v7a,arm64-v8a,x86,x86_64
        run: npm run native:android:build

      - name: Show ccache stats
        if: success() || failure()
        run: ccache --show-stats

      - name: Save native build caches
        if: success() || failure()
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.ccache
            ~/.gradle/caches/build-cache-1
          key: android-build-${{ runner.os }}-debug-${{ github.run_id }}

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: cohub-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-*-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS simulator build
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        id: node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # file: dependencies (modules/*) install as symlinks into the checkout, so the cache holds
      # only the links; their package.json files are in the key for the dependencies they declare.
      # The vendored Markdown renderer's postinstall downloads native sources into its checkout
      # folder; they are cached alongside, as both native builds and the OTA fingerprint read them.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            modules/react-native-enriched-markdown/cpp/highlight/vendor/grammars
            modules/react-native-enriched-markdown/cpp/highlight/vendor/tree-sitter
            modules/react-native-enriched-markdown/ios/vendor
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json', 'modules/*/package.json', 'modules/react-native-enriched-markdown/*.mjs', 'modules/react-native-enriched-markdown/ratex-version.json', 'modules/react-native-enriched-markdown/cpp/highlight/grammar-versions.json') }}

      # The postinstall only warns when a download fails; an incomplete set is never cached.
      - name: Install dependencies
        id: npm-ci
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: |
          npm ci
          vendor=modules/react-native-enriched-markdown
          if [ -f "$vendor/cpp/highlight/vendor/grammars/.stamp" ] && [ -f "$vendor/cpp/highlight/vendor/tree-sitter/.stamp" ] && [ -f "$vendor/ios/vendor/.stamp" ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          fi

      # Saved before anything else runs: later steps write build output into node_modules.
      - name: Save node_modules
        if: steps.npm-ci.outputs.complete == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            node_modules
            modules/react-native-enriched-markdown/cpp/highlight/vendor/grammars
            modules/react-native-enriched-markdown/cpp/highlight/vendor/tree-sitter
            modules/react-native-enriched-markdown/ios/vendor
          key: ${{ steps.node-modules.outputs.cache-primary-key }}

      # CocoaPods' download cache, mostly React Native's prebuilt frameworks. pod install still
      # resolves and generates the Pods project from node_modules on every run.
      - name: Restore CocoaPods cache
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            cocoapods-${{ runner.os }}-

      - name: Generate iOS project and install pods
        run: npm run native:ios:prepare

      - name: Compile simulator app
        run: npm run native:ios:build

      - name: Upload simulator app
        uses: actions/upload-artifact@v7
        with:
          name: cohub-ios-simulator-${{ github.sha }}
          path: build/artifacts/Cohub-ios-simulator.zip
          if-no-files-found: error
          retention-days: 7
