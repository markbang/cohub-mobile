name: Publish OTA

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character commit SHA. Production requires a main commit; staging accepts any pushed branch. Main pushes publish github.sha.
        required: false
        type: string
      channel:
        description: OTA channel. Main pushes always publish production.
        required: true
        type: choice
        options: [staging, production]
        default: production

permissions:
  contents: read

concurrency:
  group: ota-publish-${{ github.event.inputs.channel || 'production' }}
  cancel-in-progress: false

env:
  CI: "true"
  EXPO_NO_TELEMETRY: "1"
  OTA_CLI_REPOSITORY: https://github.com/markbang/yaota.git
  OTA_CLI_REVISION: 62e237e864b291c6ee266a6af820569817ab984c

jobs:
  prepare:
    name: Validate target
    if: github.repository == 'markbang/cohub-mobile'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      channel: ${{ steps.target.outputs.channel }}
      subject: ${{ steps.target.outputs.subject }}
    steps:
      # Later jobs trust this run's own checkout, so a dispatch from another ref must stop here, visibly.
      - name: Require a main dispatch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error title=Run from main::Dispatch Publish OTA from main and pass the branch commit as the 'commit' input."
            exit 1
          fi

      - name: Checkout main history
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Validate target commit
        id: target
        env:
          COMMIT: ${{ github.event.inputs.commit || github.sha }}
          CHANNEL: ${{ github.event.inputs.channel || 'production' }}
        run: |
          set -euo pipefail
          sha=$(node --input-type=module -e 'import { parseCommitSha } from "./scripts/ota-publish.mjs"; process.stdout.write(parseCommitSha(process.env.COMMIT))')
          channel=$(CHANNEL="$CHANNEL" node --input-type=module -e 'import { parseChannel } from "./scripts/ota-publish.mjs"; process.stdout.write(parseChannel(process.env.CHANNEL))')
          # Production serves every installed build, so it only ships reviewed main commits.
          # Staging only reaches builds switched to it from the debug menu, so it may preview a pushed branch.
          if [ "$channel" = "production" ]; then
            git merge-base --is-ancestor "$sha" origin/main || { echo "Production OTA must publish a commit on main."; exit 1; }
          else
            git cat-file -e "$sha^{commit}" || { echo "Commit $sha is not in this repository. Push its branch first."; exit 1; }
          fi
          git checkout --force --detach "$sha"
          {
            echo "sha=$sha"
            echo "channel=$channel"
            echo "subject<<SUBJECT_EOF"
            git log -1 --format=%s "$sha"
            echo "SUBJECT_EOF"
          } >> "$GITHUB_OUTPUT"

  # Gates both uploads without delaying the exports: the publish jobs need this job too.
  check:
    name: Quality checks
    needs: prepare
    if: github.repository == 'markbang/cohub-mobile' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up Node
        id: node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # file: dependencies (modules/*) install as symlinks into the checkout, so the cache holds
      # only the links; their package.json files are in the key for the dependencies they declare.
      # The vendored Markdown renderer's postinstall downloads native sources into its checkout
      # folder; they are cached alongside, as both native builds and the OTA fingerprint read them.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            modules/react-native-enriched-markdown/cpp/highlight/vendor/grammars
            modules/react-native-enriched-markdown/cpp/highlight/vendor/tree-sitter
            modules/react-native-enriched-markdown/ios/vendor
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json', 'modules/*/package.json', 'modules/react-native-enriched-markdown/*.mjs', 'modules/react-native-enriched-markdown/ratex-version.json', 'modules/react-native-enriched-markdown/cpp/highlight/grammar-versions.json') }}

      # The postinstall only warns when a download fails; an incomplete set is never cached.
      - name: Install dependencies
        id: npm-ci
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: |
          npm ci
          vendor=modules/react-native-enriched-markdown
          if [ -f "$vendor/cpp/highlight/vendor/grammars/.stamp" ] && [ -f "$vendor/cpp/highlight/vendor/tree-sitter/.stamp" ] && [ -f "$vendor/ios/vendor/.stamp" ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          fi

      # Only a production target (a main commit) may write caches main-scope runs restore;
      # staging may select an unreviewed branch. Saved before later steps write into node_modules.
      - name: Save node_modules
        if: steps.npm-ci.outputs.complete == 'true' && needs.prepare.outputs.channel == 'production'
        uses: actions/cache/save@v6
        with:
          path: |
            node_modules
            modules/react-native-enriched-markdown/cpp/highlight/vendor/grammars
            modules/react-native-enriched-markdown/cpp/highlight/vendor/tree-sitter
            modules/react-native-enriched-markdown/ios/vendor
          key: ${{ steps.node-modules.outputs.cache-primary-key }}

      - name: Run quality checks
        run: npm run check

  android:
    name: Export Android bundle
    needs: prepare
    if: github.repository == 'markbang/cohub-mobile' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_UPDATES_URL: ${{ vars.EXPO_PUBLIC_UPDATES_URL }}
    outputs:
      runtime: ${{ steps.fingerprint.outputs.runtime }}
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up Node
        id: node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # file: dependencies (modules/*) install as symlinks into the checkout, so the cache holds
      # only the links; their package.json files are in the key for the dependencies they declare.
      # The vendored Markdown renderer's postinstall downloads native sources into its checkout
      # folder; they are cached alongside, as both native builds and the OTA fingerprint read them.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            modules/react-native-enriched-markdown/cpp/highlight/vendor/grammars
            modules/react-native-enriched-markdown/cpp/highlight/vendor/tree-sitter
            modules/react-native-enriched-markdown/ios/vendor
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json', 'modules/*/package.json', 'modules/react-native-enriched-markdown/*.mjs', 'modules/react-native-enriched-markdown/ratex-version.json', 'modules/react-native-enriched-markdown/cpp/highlight/grammar-versions.json') }}

      # The postinstall only warns when a download fails; an incomplete set is never cached.
      - name: Install dependencies
        id: npm-ci
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: |
          npm ci
          vendor=modules/react-native-enriched-markdown
          if [ -f "$vendor/cpp/highlight/vendor/grammars/.stamp" ] && [ -f "$vendor/cpp/highlight/vendor/tree-sitter/.stamp" ] && [ -f "$vendor/ios/vendor/.stamp" ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          fi

      # Only a production target (a main commit) may write caches main-scope runs restore;
      # staging may select an unreviewed branch. Saved before later steps write into node_modules.
      - name: Save node_modules
        if: steps.npm-ci.outputs.complete == 'true' && needs.prepare.outputs.channel == 'production'
        uses: actions/cache/save@v6
        with:
          path: |
            node_modules
            modules/react-native-enriched-markdown/cpp/highlight/vendor/grammars
            modules/react-native-enriched-markdown/cpp/highlight/vendor/tree-sitter
            modules/react-native-enriched-markdown/ios/vendor
          key: ${{ steps.node-modules.outputs.cache-primary-key }}

      - name: Resolve installed APK runtime
        id: fingerprint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-apk"
          # One query, no pipe: `grep -q` exits on its match, gh dies of SIGPIPE on its next line, and
          # pipefail turned that match into a miss, so an older release's runtime was used.
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | select((.draft or .prerelease) | not) | select(any(.assets[].name; test("^cohub-v.+-android-arm64-v8a\\.apk$")))] | sort_by(.created_at) | last | .tag_name // empty')
          if [[ -z "$tag" ]]; then
            echo "::error title=Android OTA not published::No Android APK has been published. Build one OTA-capable APK with Native Release first; JS-only changes can OTA after that."
            exit 1
          fi
          asset=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name | select(endswith("-android-arm64-v8a.apk"))')
          test -n "$asset" || { echo "::error title=Android OTA not published::arm64 APK missing from $tag."; exit 1; }
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$RUNNER_TEMP/native-apk"
          apk="$RUNNER_TEMP/native-apk/$asset"
          test -f "$apk" || { echo "::error title=Android OTA not published::Failed to download $asset from $tag."; exit 1; }
          runtime=$(unzip -p "$apk" assets/fingerprint | tr -d '[:space:]' | tr 'A-F' 'a-f')
          runtime=$(RUNTIME="$runtime" node --input-type=module -e 'import { parseFingerprintHash } from "./scripts/ota-publish.mjs"; process.stdout.write(parseFingerprintHash(process.env.RUNTIME, "installed APK assets/fingerprint"))')
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'cohub-android-native-fingerprint.txt' --dir "$RUNNER_TEMP/native-apk"
          native_fingerprint=$(tr -d '[:space:]' < "$RUNNER_TEMP/native-apk/cohub-android-native-fingerprint.txt")
          native_fingerprint=$(NATIVE_FINGERPRINT="$native_fingerprint" node --input-type=module -e 'import { parseFingerprintHash } from "./scripts/ota-publish.mjs"; process.stdout.write(parseFingerprintHash(process.env.NATIVE_FINGERPRINT, "released Android source fingerprint"))')
          echo "Using $tag APK runtime $runtime"
          {
            echo "runtime=$runtime"
            echo "fingerprint=$native_fingerprint"
          } >> "$GITHUB_OUTPUT"

      # Metro keys transforms by content and the inlined EXPO_PUBLIC_* values; the key also carries
      # them so this export only restores caches built with the same public configuration.
      - name: Locate Metro cache
        id: metro
        run: |
          echo "path=$(node -p "require('os').tmpdir()")/metro-cache" >> "$GITHUB_OUTPUT"
          echo "env=$({ env | grep '^EXPO_PUBLIC_' || true; } | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore Metro cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.metro.outputs.path }}
          key: metro-ota-${{ runner.os }}-android-${{ hashFiles('package-lock.json') }}-${{ steps.metro.outputs.env }}-${{ github.run_id }}
          restore-keys: |
            metro-ota-${{ runner.os }}-android-${{ hashFiles('package-lock.json') }}-${{ steps.metro.outputs.env }}-

      - name: Export Android bundle
        run: npx expo export --platform android --output-dir dist/android

      - name: Save Metro cache
        if: needs.prepare.outputs.channel == 'production'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.metro.outputs.path }}
          key: metro-ota-${{ runner.os }}-android-${{ hashFiles('package-lock.json') }}-${{ steps.metro.outputs.env }}-${{ github.run_id }}

      # The selected commit's code (app config, fingerprint inputs) only runs in this job,
      # which holds no publishing secret. The upload job consumes these files as data.
      - name: Record publish inputs
        env:
          COHUB_OTA_RUNTIME_VERSION: ${{ steps.fingerprint.outputs.runtime }}
        run: |
          set -euo pipefail
          mkdir -p dist/publish-inputs
          env -u COHUB_OTA_RUNTIME_VERSION npx @expo/fingerprint fingerprint:generate --platform android > dist/publish-inputs/source-fingerprint.json
          npx expo config --type public --json > dist/publish-inputs/ota-config.json

      - name: Upload publish inputs
        uses: actions/upload-artifact@v7
        with:
          name: cohub-ota-inputs-android-${{ needs.prepare.outputs.channel }}-${{ needs.prepare.outputs.sha }}
          path: dist/publish-inputs
          if-no-files-found: error
          retention-days: 14

      - name: Upload export
        uses: actions/upload-artifact@v7
        with:
          name: cohub-ota-android-${{ needs.prepare.outputs.channel }}-${{ needs.prepare.outputs.sha }}
          path: dist/android
          if-no-files-found: error
          retention-days: 14

      - name: Summarize candidate
        env:
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          SHA: ${{ needs.prepare.outputs.sha }}
          SUBJECT: ${{ needs.prepare.outputs.subject }}
          RUNTIME: ${{ steps.fingerprint.outputs.runtime }}
          FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
        run: |
          set -euo pipefail
          {
            echo "## OTA candidate (Android)"
            echo
            echo "- Channel: \`$CHANNEL\`"
            echo "- Commit: \`$SHA\`"
            echo "- Subject: $SUBJECT"
            echo "- Runtime: \`$RUNTIME\`"
            echo "- Native fingerprint: \`$FINGERPRINT\`"
            echo
            echo "This job exported the Android bundle. The publish job uploads that artifact immediately; it does not export again."
          } >> "$GITHUB_STEP_SUMMARY"

  ios:
    name: Export iOS bundle
    needs: prepare
    if: github.repository == 'markbang/cohub-mobile' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_UPDATES_URL: ${{ vars.EXPO_PUBLIC_UPDATES_URL }}
    outputs:
      runtime: ${{ steps.fingerprint.outputs.runtime }}
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up Node
        id: node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # file: dependencies (modules/*) install as symlinks into the checkout, so the cache holds
      # only the links; their package.json files are in the key for the dependencies they declare.
      # The vendored Markdown renderer's postinstall downloads native sources into its checkout
      # folder; they are cached alongside, as both native builds and the OTA fingerprint read them.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            modules/react-native-enriched-markdown/cpp/highlight/vendor/grammars
            modules/react-native-enriched-markdown/cpp/highlight/vendor/tree-sitter
            modules/react-native-enriched-markdown/ios/vendor
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json', 'modules/*/package.json', 'modules/react-native-enriched-markdown/*.mjs', 'modules/react-native-enriched-markdown/ratex-version.json', 'modules/react-native-enriched-markdown/cpp/highlight/grammar-versions.json') }}

      # The postinstall only warns when a download fails; an incomplete set is never cached.
      - name: Install dependencies
        id: npm-ci
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: |
          npm ci
          vendor=modules/react-native-enriched-markdown
          if [ -f "$vendor/cpp/highlight/vendor/grammars/.stamp" ] && [ -f "$vendor/cpp/highlight/vendor/tree-sitter/.stamp" ] && [ -f "$vendor/ios/vendor/.stamp" ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          fi

      # Only a production target (a main commit) may write caches main-scope runs restore;
      # staging may select an unreviewed branch. Saved before later steps write into node_modules.
      - name: Save node_modules
        if: steps.npm-ci.outputs.complete == 'true' && needs.prepare.outputs.channel == 'production'
        uses: actions/cache/save@v6
        with:
          path: |
            node_modules
            modules/react-native-enriched-markdown/cpp/highlight/vendor/grammars
            modules/react-native-enriched-markdown/cpp/highlight/vendor/tree-sitter
            modules/react-native-enriched-markdown/ios/vendor
          key: ${{ steps.node-modules.outputs.cache-primary-key }}

      # Native Release extracts this asset from the built IPA and attaches it only for submitted TestFlight builds.
      - name: Resolve installed iOS runtime
        id: fingerprint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-ipa"
          # One query, no pipe, as for Android.
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | select((.draft or .prerelease) | not) | select(any(.assets[].name; . == "cohub-ios-native-fingerprint.txt"))] | sort_by(.created_at) | last | .tag_name // empty')
          if [[ -z "$tag" ]]; then
            echo "::error title=iOS OTA not published::No iOS OTA fingerprint has been published. Ship one OTA-capable TestFlight build with Native Release (platform=ios, profile=production, submit=true) first; JS-only changes can OTA after that."
            exit 1
          fi
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'cohub-ios-native-fingerprint.txt' --dir "$RUNNER_TEMP/native-ipa"
          fingerprint_file="$RUNNER_TEMP/native-ipa/cohub-ios-native-fingerprint.txt"
          test -f "$fingerprint_file" || { echo "::error title=iOS OTA not published::Failed to download cohub-ios-native-fingerprint.txt from $tag."; exit 1; }
          runtime=$(tr -d '[:space:]' < "$fingerprint_file" | tr 'A-F' 'a-f')
          runtime=$(RUNTIME="$runtime" node --input-type=module -e 'import { parseFingerprintHash } from "./scripts/ota-publish.mjs"; process.stdout.write(parseFingerprintHash(process.env.RUNTIME, "released cohub-ios-native-fingerprint.txt"))')
          echo "Using $tag iOS runtime $runtime"
          {
            echo "runtime=$runtime"
            echo "fingerprint=$runtime"
          } >> "$GITHUB_OUTPUT"

      # Metro keys transforms by content and the inlined EXPO_PUBLIC_* values; the key also carries
      # them so this export only restores caches built with the same public configuration.
      - name: Locate Metro cache
        id: metro
        run: |
          echo "path=$(node -p "require('os').tmpdir()")/metro-cache" >> "$GITHUB_OUTPUT"
          echo "env=$({ env | grep '^EXPO_PUBLIC_' || true; } | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore Metro cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.metro.outputs.path }}
          key: metro-ota-${{ runner.os }}-ios-${{ hashFiles('package-lock.json') }}-${{ steps.metro.outputs.env }}-${{ github.run_id }}
          restore-keys: |
            metro-ota-${{ runner.os }}-ios-${{ hashFiles('package-lock.json') }}-${{ steps.metro.outputs.env }}-

      - name: Export iOS bundle
        run: npx expo export --platform ios --output-dir dist/ios

      - name: Save Metro cache
        if: needs.prepare.outputs.channel == 'production'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.metro.outputs.path }}
          key: metro-ota-${{ runner.os }}-ios-${{ hashFiles('package-lock.json') }}-${{ steps.metro.outputs.env }}-${{ github.run_id }}

      # The selected commit's code (app config, fingerprint inputs) only runs in this job,
      # which holds no publishing secret. The upload job consumes these files as data.
      - name: Record publish inputs
        env:
          COHUB_OTA_RUNTIME_VERSION: ${{ steps.fingerprint.outputs.runtime }}
        run: |
          set -euo pipefail
          mkdir -p dist/publish-inputs
          env -u COHUB_OTA_RUNTIME_VERSION npx @expo/fingerprint fingerprint:generate --platform ios > dist/publish-inputs/source-fingerprint.json
          npx expo config --type public --json > dist/publish-inputs/ota-config.json

      - name: Upload publish inputs
        uses: actions/upload-artifact@v7
        with:
          name: cohub-ota-inputs-ios-${{ needs.prepare.outputs.channel }}-${{ needs.prepare.outputs.sha }}
          path: dist/publish-inputs
          if-no-files-found: error
          retention-days: 14

      - name: Upload export
        uses: actions/upload-artifact@v7
        with:
          name: cohub-ota-ios-${{ needs.prepare.outputs.channel }}-${{ needs.prepare.outputs.sha }}
          path: dist/ios
          if-no-files-found: error
          retention-days: 14

      - name: Summarize candidate
        env:
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          SHA: ${{ needs.prepare.outputs.sha }}
          SUBJECT: ${{ needs.prepare.outputs.subject }}
          RUNTIME: ${{ steps.fingerprint.outputs.runtime }}
          FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
        run: |
          set -euo pipefail
          {
            echo "## OTA candidate (iOS)"
            echo
            echo "- Channel: \`$CHANNEL\`"
            echo "- Commit: \`$SHA\`"
            echo "- Subject: $SUBJECT"
            echo "- Runtime: \`$RUNTIME\`"
            echo "- Native fingerprint: \`$FINGERPRINT\`"
            echo
            echo "This job exported the iOS bundle. The publish job uploads that artifact immediately; it does not export again."
          } >> "$GITHUB_STEP_SUMMARY"

  publish-android:
    name: Upload Android ${{ needs.prepare.outputs.channel }}
    needs: [prepare, check, android]
    if: github.repository == 'markbang/cohub-mobile' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35  # three publish attempts, each bounded by a 5-minute response timeout
    steps:
      # Only the dispatching main commit's scripts run beside OTA_API_KEY; the selected
      # commit arrives as artifacts from its export job.
      - name: Checkout trusted publish scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Node
        id: node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download export
        uses: actions/download-artifact@v8
        with:
          name: cohub-ota-android-${{ needs.prepare.outputs.channel }}-${{ needs.prepare.outputs.sha }}
          path: ${{ runner.temp }}/cohub-ota-export

      - name: Download publish inputs
        uses: actions/download-artifact@v8
        with:
          name: cohub-ota-inputs-android-${{ needs.prepare.outputs.channel }}-${{ needs.prepare.outputs.sha }}
          path: ${{ runner.temp }}/cohub-ota-inputs

      # Only this job saves the entry, and only after installing the pinned revision itself.
      - name: Restore pinned OTA CLI
        id: ota-cli
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ota-cli
          key: ota-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ env.OTA_CLI_REVISION }}

      - name: Install pinned OTA CLI
        if: steps.ota-cli.outputs.cache-hit != 'true'
        env:
          OTA_CLI_REPOSITORY: ${{ env.OTA_CLI_REPOSITORY }}
          OTA_CLI_REVISION: ${{ env.OTA_CLI_REVISION }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout "$OTA_CLI_REPOSITORY" "$RUNNER_TEMP/ota-cli"
          git -C "$RUNNER_TEMP/ota-cli" fetch --depth 1 origin "$OTA_CLI_REVISION"
          git -C "$RUNNER_TEMP/ota-cli" checkout --force "$OTA_CLI_REVISION"
          test "$(git -C "$RUNNER_TEMP/ota-cli" rev-parse HEAD)" = "$OTA_CLI_REVISION"
          npm ci --prefix "$RUNNER_TEMP/ota-cli"

      - name: Save pinned OTA CLI
        if: steps.ota-cli.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ota-cli
          key: ${{ steps.ota-cli.outputs.cache-primary-key }}

      - name: Verify pinned OTA CLI
        run: |
          head=$(git -C "$RUNNER_TEMP/ota-cli" rev-parse HEAD)
          test "$head" = "$OTA_CLI_REVISION" || { echo "::error title=OTA CLI revision::Restored OTA CLI is at $head, expected $OTA_CLI_REVISION."; exit 1; }

      - name: Publish exported bundle
        env:
          OTA_SERVER: ${{ vars.OTA_SERVER }}
          OTA_API_KEY: ${{ secrets.OTA_API_KEY }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          OTA_PLATFORM: android
          SOURCE_COMMIT: ${{ needs.prepare.outputs.sha }}
          COHUB_OTA_RUNTIME_VERSION: ${{ needs.android.outputs.runtime }}
          NATIVE_SOURCE_FINGERPRINT: ${{ needs.android.outputs.fingerprint }}
          OTA_EXPORT_DIR: ${{ runner.temp }}/cohub-ota-export
          OTA_INPUTS_DIR: ${{ runner.temp }}/cohub-ota-inputs
        run: |
          set -euo pipefail
          test -n "$OTA_API_KEY" || { echo "OTA_API_KEY is required."; exit 1; }
          origin=$(OTA_SERVER="$OTA_SERVER" node --input-type=module -e 'import { parseHttpsOrigin } from "./scripts/ota-publish.mjs"; process.stdout.write(parseHttpsOrigin(process.env.OTA_SERVER, "OTA_SERVER"))')
          runtime=$(COHUB_OTA_RUNTIME_VERSION="$COHUB_OTA_RUNTIME_VERSION" node --input-type=module -e 'import { parseFingerprintHash } from "./scripts/ota-publish.mjs"; process.stdout.write(parseFingerprintHash(process.env.COHUB_OTA_RUNTIME_VERSION, "prepare runtime"))')
          test -d "$OTA_EXPORT_DIR"
          SOURCE_FINGERPRINT=$(node --input-type=module -e 'import { readFileSync } from "node:fs"; import { fingerprintFromCliJson } from "./scripts/ota-publish.mjs"; process.stdout.write(fingerprintFromCliJson(readFileSync(process.env.OTA_INPUTS_DIR + "/source-fingerprint.json", "utf8"), "source fingerprint"))')
          NATIVE_SOURCE_FINGERPRINT=$(NATIVE_SOURCE_FINGERPRINT="$NATIVE_SOURCE_FINGERPRINT" node --input-type=module -e 'import { parseFingerprintHash } from "./scripts/ota-publish.mjs"; process.stdout.write(parseFingerprintHash(process.env.NATIVE_SOURCE_FINGERPRINT, "released Android source fingerprint"))')
          if ! SOURCE_FINGERPRINT="$SOURCE_FINGERPRINT" node --input-type=module -e 'import { assertFingerprintsMatch } from "./scripts/ota-publish.mjs"; assertFingerprintsMatch(process.env.NATIVE_SOURCE_FINGERPRINT, process.env.SOURCE_FINGERPRINT)'; then
            # Not publishing is a failure: a green run with one platform missing went unnoticed for a release.
            reason="this commit's native fingerprint $SOURCE_FINGERPRINT differs from the released APK's $NATIVE_SOURCE_FINGERPRINT"
            printf '## Android OTA not published\n\n%s.\n\nRun Native Release with `platform=android`, `profile=distribution` and the release tag to ship a matching native build; JS-only commits publish again afterwards.\n' "$reason" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Android OTA not published::$reason. Ship a matching native build first."
            exit 1
          fi
          # Validate against the released APK before the first OTA can register this runtime.
          # Transient transport/server failures retry. Repeating is safe: blobs are
          # content-addressed, an interrupted attempt leaves at most an unserved Staged
          # release, and the concurrency group keeps a newer commit from being overtaken.
          attempts=$(node --input-type=module -e 'import { OTA_PUBLISH_ATTEMPTS } from "./scripts/ota-publish.mjs"; process.stdout.write(String(OTA_PUBLISH_ATTEMPTS))')
          for attempt in $(seq 1 "$attempts"); do
            set +e
            OTA_SERVER="$origin" node "$RUNNER_TEMP/ota-cli/scripts/publish.ts" \
              --app-id cohub-mobile \
              --config "$OTA_INPUTS_DIR/ota-config.json" \
              --runtime "$runtime" \
              --fingerprint "$SOURCE_FINGERPRINT" \
              --commit "$SOURCE_COMMIT" \
              --delta-bases 3 \
              --channel "$CHANNEL" \
              --platform android \
              --export-dir "$OTA_EXPORT_DIR" 2>&1 | tee "$RUNNER_TEMP/ota-publish.log"
            status=${PIPESTATUS[0]}
            set -e
            if [[ $status -eq 0 ]]; then exit 0; fi
            if grep -q "Fingerprint mismatch" "$RUNNER_TEMP/ota-publish.log"; then
              {
                echo "## Android OTA not published"
                echo
                echo "The OTA server rejected this bundle because its native fingerprint differs from the latest update on runtime \`$runtime\`."
                echo "This commit changed native/SDK code, so it cannot ride the installed binary."
                echo
                echo "Run **Native Release** with \`platform=android\`, \`profile=distribution\`, and the release tag to publish a matching native distribution; JS-only commits publish again afterwards."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error title=Android OTA not published::The OTA server rejected the bundle: its native fingerprint differs from the latest update on runtime $runtime. Ship a matching native build first."
              exit 1
            fi
            if (( attempt == attempts )) || ! node --input-type=module -e 'import { readFileSync } from "node:fs"; import { isTransientOtaFailure } from "./scripts/ota-publish.mjs"; process.exit(isTransientOtaFailure(readFileSync(process.env.RUNNER_TEMP + "/ota-publish.log", "utf8")) ? 0 : 1)'; then
              exit "$status"
            fi
            delay=$((attempt * 30))
            echo "::warning title=Android OTA retry::Attempt $attempt/$attempts failed with a transient error; retrying in ${delay}s."
            sleep "$delay"
          done

  publish-ios:
    name: Upload iOS ${{ needs.prepare.outputs.channel }}
    needs: [prepare, check, ios]
    if: github.repository == 'markbang/cohub-mobile' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35  # three publish attempts, each bounded by a 5-minute response timeout
    steps:
      # Only the dispatching main commit's scripts run beside OTA_API_KEY; the selected
      # commit arrives as artifacts from its export job.
      - name: Checkout trusted publish scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Node
        id: node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download export
        uses: actions/download-artifact@v8
        with:
          name: cohub-ota-ios-${{ needs.prepare.outputs.channel }}-${{ needs.prepare.outputs.sha }}
          path: ${{ runner.temp }}/cohub-ota-export

      - name: Download publish inputs
        uses: actions/download-artifact@v8
        with:
          name: cohub-ota-inputs-ios-${{ needs.prepare.outputs.channel }}-${{ needs.prepare.outputs.sha }}
          path: ${{ runner.temp }}/cohub-ota-inputs

      # Only this job saves the entry, and only after installing the pinned revision itself.
      - name: Restore pinned OTA CLI
        id: ota-cli
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ota-cli
          key: ota-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ env.OTA_CLI_REVISION }}

      - name: Install pinned OTA CLI
        if: steps.ota-cli.outputs.cache-hit != 'true'
        env:
          OTA_CLI_REPOSITORY: ${{ env.OTA_CLI_REPOSITORY }}
          OTA_CLI_REVISION: ${{ env.OTA_CLI_REVISION }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout "$OTA_CLI_REPOSITORY" "$RUNNER_TEMP/ota-cli"
          git -C "$RUNNER_TEMP/ota-cli" fetch --depth 1 origin "$OTA_CLI_REVISION"
          git -C "$RUNNER_TEMP/ota-cli" checkout --force "$OTA_CLI_REVISION"
          test "$(git -C "$RUNNER_TEMP/ota-cli" rev-parse HEAD)" = "$OTA_CLI_REVISION"
          npm ci --prefix "$RUNNER_TEMP/ota-cli"

      - name: Save pinned OTA CLI
        if: steps.ota-cli.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ota-cli
          key: ${{ steps.ota-cli.outputs.cache-primary-key }}

      - name: Verify pinned OTA CLI
        run: |
          head=$(git -C "$RUNNER_TEMP/ota-cli" rev-parse HEAD)
          test "$head" = "$OTA_CLI_REVISION" || { echo "::error title=OTA CLI revision::Restored OTA CLI is at $head, expected $OTA_CLI_REVISION."; exit 1; }

      - name: Publish exported bundle
        env:
          OTA_SERVER: ${{ vars.OTA_SERVER }}
          OTA_API_KEY: ${{ secrets.OTA_API_KEY }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          OTA_PLATFORM: ios
          SOURCE_COMMIT: ${{ needs.prepare.outputs.sha }}
          COHUB_OTA_RUNTIME_VERSION: ${{ needs.ios.outputs.runtime }}
          NATIVE_SOURCE_FINGERPRINT: ${{ needs.ios.outputs.fingerprint }}
          OTA_EXPORT_DIR: ${{ runner.temp }}/cohub-ota-export
          OTA_INPUTS_DIR: ${{ runner.temp }}/cohub-ota-inputs
        run: |
          set -euo pipefail
          test -n "$OTA_API_KEY" || { echo "OTA_API_KEY is required."; exit 1; }
          origin=$(OTA_SERVER="$OTA_SERVER" node --input-type=module -e 'import { parseHttpsOrigin } from "./scripts/ota-publish.mjs"; process.stdout.write(parseHttpsOrigin(process.env.OTA_SERVER, "OTA_SERVER"))')
          runtime=$(COHUB_OTA_RUNTIME_VERSION="$COHUB_OTA_RUNTIME_VERSION" node --input-type=module -e 'import { parseFingerprintHash } from "./scripts/ota-publish.mjs"; process.stdout.write(parseFingerprintHash(process.env.COHUB_OTA_RUNTIME_VERSION, "prepare runtime"))')
          test -d "$OTA_EXPORT_DIR"
          SOURCE_FINGERPRINT=$(node --input-type=module -e 'import { readFileSync } from "node:fs"; import { fingerprintFromCliJson } from "./scripts/ota-publish.mjs"; process.stdout.write(fingerprintFromCliJson(readFileSync(process.env.OTA_INPUTS_DIR + "/source-fingerprint.json", "utf8"), "source fingerprint"))')
          NATIVE_SOURCE_FINGERPRINT=$(NATIVE_SOURCE_FINGERPRINT="$NATIVE_SOURCE_FINGERPRINT" node --input-type=module -e 'import { parseFingerprintHash } from "./scripts/ota-publish.mjs"; process.stdout.write(parseFingerprintHash(process.env.NATIVE_SOURCE_FINGERPRINT, "released iOS native fingerprint"))')
          # The server pins a runtime to the first fingerprint published on it, so a mismatched
          # commit must never reach it: it would block every matching OTA on that runtime.
          if ! SOURCE_FINGERPRINT="$SOURCE_FINGERPRINT" node --input-type=module -e 'import { assertFingerprintsMatch } from "./scripts/ota-publish.mjs"; assertFingerprintsMatch(process.env.NATIVE_SOURCE_FINGERPRINT, process.env.SOURCE_FINGERPRINT)'; then
            # Not publishing is a failure: a green run with one platform missing went unnoticed for a release.
            reason="this commit's native fingerprint $SOURCE_FINGERPRINT differs from the released IPA's $NATIVE_SOURCE_FINGERPRINT"
            printf '## iOS OTA not published\n\n%s.\n\nRun Native Release with `platform=ios`, `profile=production`, `submit=true` to ship a matching native build; JS-only commits publish again afterwards.\n' "$reason" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=iOS OTA not published::$reason. Ship a matching native build first."
            exit 1
          fi
          # Retries transient failures exactly like the Android publish; a fingerprint-mismatch
          # rejection fails with the native build to ship, as it does there.
          attempts=$(node --input-type=module -e 'import { OTA_PUBLISH_ATTEMPTS } from "./scripts/ota-publish.mjs"; process.stdout.write(String(OTA_PUBLISH_ATTEMPTS))')
          for attempt in $(seq 1 "$attempts"); do
            set +e
            OTA_SERVER="$origin" node "$RUNNER_TEMP/ota-cli/scripts/publish.ts" \
              --app-id cohub-mobile \
              --config "$OTA_INPUTS_DIR/ota-config.json" \
              --runtime "$runtime" \
              --fingerprint "$SOURCE_FINGERPRINT" \
              --commit "$SOURCE_COMMIT" \
              --delta-bases 3 \
              --channel "$CHANNEL" \
              --platform ios \
              --export-dir "$OTA_EXPORT_DIR" 2>&1 | tee "$RUNNER_TEMP/ota-publish.log"
            status=${PIPESTATUS[0]}
            set -e
            if [[ $status -eq 0 ]]; then exit 0; fi
            if grep -q "Fingerprint mismatch" "$RUNNER_TEMP/ota-publish.log"; then
              {
                echo "## iOS OTA not published"
                echo
                echo "The OTA server rejected this bundle because its native fingerprint differs from the latest update on runtime \`$runtime\`."
                echo "This commit changed native/SDK code, so it cannot ride the installed binary."
                echo
                echo "Run **Native Release** with \`platform=ios\`, \`profile=production\`, and \`submit=true\` to publish a matching TestFlight build; JS-only commits publish again afterwards."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error title=iOS OTA not published::The OTA server rejected the bundle: its native fingerprint differs from the latest update on runtime $runtime. Ship a matching native build first."
              exit 1
            fi
            if (( attempt == attempts )) || ! node --input-type=module -e 'import { readFileSync } from "node:fs"; import { isTransientOtaFailure } from "./scripts/ota-publish.mjs"; process.exit(isTransientOtaFailure(readFileSync(process.env.RUNNER_TEMP + "/ota-publish.log", "utf8")) ? 0 : 1)'; then
              exit "$status"
            fi
            delay=$((attempt * 30))
            echo "::warning title=iOS OTA retry::Attempt $attempt/$attempts failed with a transient error; retrying in ${delay}s."
            sleep "$delay"
          done
