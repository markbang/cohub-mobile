name: UI Snapshots (Android)

# Captures the screens on an Android emulator. ui-snapshots-ios.yml captures the same screens on
# iOS; each platform runs on its own so a failure can be retried without waiting for the other.
# Pair the two downloads with `node scripts/ui-snapshots.mjs compare` (see docs/ui-snapshots.md).
# The debug APK is cached by native fingerprint and loads the branch's JS from Metro, so a
# JS-only change skips the native build.
on:
  workflow_dispatch:
    inputs:
      screens:
        description: Screens to capture, comma-separated (see SCREENS in scripts/ui-snapshots.mjs). Defaults to all.
        required: false
        type: string
      themes:
        description: Themes to capture.
        required: false
        default: light,dark
        type: string
      motion:
        description: Also record the interactions in MOTIONS as videos (phone only).
        required: false
        default: true
        type: boolean
      target:
        description: The device class. tablet runs the split layout in both orientations, then the e2e/tablet flow.
        required: false
        default: phone
        type: choice
        options:
          - phone
          - tablet
      orientations:
        description: Orientations to capture, comma-separated. Defaults to portrait on a phone and portrait,landscape on a tablet.
        required: false
        type: string
      perf:
        description: Frame-probe runs of the perf sequence (0 skips it).
        required: false
        default: "0"
        type: string

permissions:
  contents: read

concurrency:
  group: ui-snapshots-android-${{ inputs.target }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  EXPO_NO_TELEMETRY: "1"
  EXPO_PUBLIC_COHUB_ENV: dev
  E2E_ACCOUNT_EMAIL: ${{ secrets.E2E_ACCOUNT_EMAIL }}
  E2E_ACCOUNT_PASSWORD: ${{ secrets.E2E_ACCOUNT_PASSWORD }}
  SCREENS_ARG: ${{ inputs.screens && format('--screens {0}', inputs.screens) || '' }}
  MOTION_ARG: ${{ !inputs.motion && '--no-motion' || '' }}
  ORIENTATIONS_ARG: ${{ inputs.orientations && format('--orientations {0}', inputs.orientations) || '' }}
  ARTIFACT: ui-snapshots-android${{ inputs.target == 'tablet' && '-tablet' || '' }}

jobs:
  android:
    name: Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Native fingerprint
        id: fingerprint
        run: |
          echo "hash=$(npx --no-install @expo/fingerprint fingerprint:generate --platform android | jq -r .hash)" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Restore and save are split so a built binary is cached even when the capture fails.
      - name: Restore debug APK
        id: apk
        uses: actions/cache/restore@v6
        with:
          path: build/ui-snapshots/cohub.apk
          # The app version is in the key: the fingerprint leaves it out, and Me shows the binary's version.
          key: ui-snapshots-android-${{ steps.fingerprint.outputs.hash }}-${{ steps.fingerprint.outputs.version }}

      - name: Set up Go
        if: steps.apk.outputs.cache-hit != 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: reference/cohub/apps/sandbox/go.mod
          cache-dependency-path: reference/cohub/apps/sandbox/go.sum

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore Gradle caches
        if: steps.apk.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build debug APK
        if: steps.apk.outputs.cache-hit != 'true'
        env:
          COHUB_ANDROID_ARCHITECTURES: x86_64
        run: |
          set -euo pipefail
          npm run native:android:prepare
          npm run native:android:build
          mkdir -p build/ui-snapshots
          cp android/app/build/outputs/apk/debug/app-x86_64-debug.apk build/ui-snapshots/cohub.apk

      - name: Save debug APK
        if: steps.apk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/ui-snapshots/cohub.apk
          key: ${{ steps.apk.outputs.cache-primary-key }}

      - name: Install Maestro
        run: |
          set -euo pipefail
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Without /dev/kvm access the emulator falls back to software emulation and never boots.
      - name: Enable KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Metro's transform cache makes the app's first bundle fast; a cold one can outlast the app's wait.
      - name: Locate Metro cache
        id: metro
        run: echo "path=$(node -p "require('os').tmpdir()")/metro-cache" >> "$GITHUB_OUTPUT"

      - name: Restore Metro cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.metro.outputs.path }}
          key: metro-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            metro-${{ runner.os }}-

      - name: Capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          # The tablet keeps its own density (1280 × 800 dp); capture sets the phone's to 402 dp wide.
          profile: ${{ inputs.target == 'tablet' && 'pixel_tablet' || 'pixel_7' }}
          emulator-boot-timeout: 900
          disable-animations: true
          # The default SwiftShader renderer took the emulator down on the first scroll under the
          # tab bar's blur; ANGLE's SwiftShader backend and more memory keep it up.
          ram-size: 4096M
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -noaudio -no-boot-anim
          script: node scripts/ui-snapshots.mjs capture --platform android --app build/ui-snapshots/cohub.apk --out dist/ui-snapshots/android --target "${{ inputs.target }}" --perf "${{ inputs.perf }}" --themes "${{ inputs.themes }}" $SCREENS_ARG $MOTION_ARG $ORIENTATIONS_ARG

      # A cancelled capture never reaches the script's own redaction, and Maestro and the simulator
      # log typed text; this repository is public.
      - name: Redact credentials
        if: always()
        run: node scripts/ui-snapshots.mjs redact --dir dist/ui-snapshots/android

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT }}
          # Maestro's command log and the device logs carry typed credentials; this repository is public.
          path: |
            dist/ui-snapshots/android
            !**/commands.json
            !**/*.log
          if-no-files-found: ignore
          # Maestro nests its debug output under a `.maestro` directory.
          include-hidden-files: true
          retention-days: 7

      - name: Save Metro cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.metro.outputs.path }}
          key: metro-${{ runner.os }}-${{ github.run_id }}
