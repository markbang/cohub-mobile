name: UI Snapshots (iOS)

# Captures the screens on an iOS simulator, the reference for ui-snapshots-android.yml. Each
# platform runs on its own so a failure can be retried without waiting for the other. The
# simulator app is cached by native fingerprint and loads the branch's JS from Metro, so a
# JS-only change skips the native build.
on:
  workflow_dispatch:
    inputs:
      screens:
        description: Screens to capture, comma-separated (see SCREENS in scripts/ui-snapshots.mjs). Defaults to all.
        required: false
        type: string
      themes:
        description: Themes to capture.
        required: false
        default: light,dark
        type: string
      motion:
        description: Also record the interactions in MOTIONS as videos (phone only).
        required: false
        default: true
        type: boolean
      target:
        description: The device class. tablet runs the split layout in both orientations, then the e2e/tablet flow.
        required: false
        default: phone
        type: choice
        options:
          - phone
          - tablet
      orientations:
        description: Orientations to capture, comma-separated. Defaults to portrait on a phone and portrait,landscape on a tablet.
        required: false
        type: string
      perf:
        description: Frame-probe runs of the perf sequence (0 skips it).
        required: false
        default: "0"
        type: string
      ios:
        description: The iOS the reference runs on. 27 uses GitHub's xcode-27 image (a preview); 26 the default macOS image.
        required: false
        default: "27"
        type: choice
        options:
          - "27"
          - "26"

permissions:
  contents: read

concurrency:
  group: ui-snapshots-ios-${{ inputs.target }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  EXPO_NO_TELEMETRY: "1"
  EXPO_PUBLIC_COHUB_ENV: dev
  E2E_ACCOUNT_EMAIL: ${{ secrets.E2E_ACCOUNT_EMAIL }}
  E2E_ACCOUNT_PASSWORD: ${{ secrets.E2E_ACCOUNT_PASSWORD }}
  SCREENS_ARG: ${{ inputs.screens && format('--screens {0}', inputs.screens) || '' }}
  MOTION_ARG: ${{ !inputs.motion && '--no-motion' || '' }}
  ORIENTATIONS_ARG: ${{ inputs.orientations && format('--orientations {0}', inputs.orientations) || '' }}
  ARTIFACT: ui-snapshots-ios${{ inputs.target == 'tablet' && '-tablet' || '' }}
  # Hosted macOS runners can take minutes to start Maestro's XCTest driver.
  MAESTRO_DRIVER_STARTUP_TIMEOUT: "240000"

jobs:
  ios:
    name: iOS simulator
    # The app is matched to iOS 27; GitHub ships its simulator only on the xcode-27 image.
    runs-on: ${{ inputs.ios == '26' && 'macos-latest' || 'xcode-27' }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        id: node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # file: dependencies (modules/*) install as symlinks into the checkout, so the cache holds
      # only the links; their package.json files are in the key for the dependencies they declare.
      # The vendored Markdown renderer's postinstall downloads native sources into its checkout
      # folder; they are cached alongside, as both native builds and the OTA fingerprint read them.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            modules/react-native-enriched-markdown/cpp/highlight/vendor/grammars
            modules/react-native-enriched-markdown/cpp/highlight/vendor/tree-sitter
            modules/react-native-enriched-markdown/ios/vendor
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json', 'modules/*/package.json', 'modules/react-native-enriched-markdown/*.mjs', 'modules/react-native-enriched-markdown/ratex-version.json', 'modules/react-native-enriched-markdown/cpp/highlight/grammar-versions.json') }}

      # The postinstall only warns when a download fails; an incomplete set is never cached.
      - name: Install dependencies
        id: npm-ci
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: |
          npm ci
          vendor=modules/react-native-enriched-markdown
          if [ -f "$vendor/cpp/highlight/vendor/grammars/.stamp" ] && [ -f "$vendor/cpp/highlight/vendor/tree-sitter/.stamp" ] && [ -f "$vendor/ios/vendor/.stamp" ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          fi

      # Saved before anything else runs: later steps write build output into node_modules.
      - name: Save node_modules
        if: steps.npm-ci.outputs.complete == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            node_modules
            modules/react-native-enriched-markdown/cpp/highlight/vendor/grammars
            modules/react-native-enriched-markdown/cpp/highlight/vendor/tree-sitter
            modules/react-native-enriched-markdown/ios/vendor
          key: ${{ steps.node-modules.outputs.cache-primary-key }}

      - name: Native fingerprint
        id: fingerprint
        run: |
          echo "hash=$(npx --no-install @expo/fingerprint fingerprint:generate --platform ios | jq -r .hash)" >> "$GITHUB_OUTPUT"
          echo "xcode=$(xcodebuild -version | awk 'NR==2 {print $3}')" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Restore simulator app
        id: app
        uses: actions/cache/restore@v6
        with:
          path: build/ui-snapshots/Cohub-ios-simulator.zip
          # Bump the version when the simulator build settings change; they are not in the fingerprint.
          # The Xcode build is in the key: an app built by one Xcode is not reused under another's simulator.
          # The app version is too: the fingerprint leaves it out, and Me shows the binary's version.
          key: ui-snapshots-ios-v3-${{ steps.fingerprint.outputs.xcode }}-${{ steps.fingerprint.outputs.hash }}-${{ steps.fingerprint.outputs.version }}

      # CocoaPods' download cache, mostly React Native's prebuilt frameworks. pod install still
      # resolves and generates the Pods project from node_modules on every run.
      - name: Restore CocoaPods cache
        if: steps.app.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            cocoapods-${{ runner.os }}-

      - name: Build simulator app
        if: steps.app.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          npm run native:ios:prepare
          npm run native:ios:build
          mkdir -p build/ui-snapshots
          cp build/artifacts/Cohub-ios-simulator.zip build/ui-snapshots/

      - name: Save simulator app
        if: steps.app.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/ui-snapshots/Cohub-ios-simulator.zip
          key: ${{ steps.app.outputs.cache-primary-key }}

      - name: Install Maestro
        run: |
          set -euo pipefail
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Metro's transform cache makes the app's first bundle fast; a cold one can outlast the app's wait.
      - name: Locate Metro cache
        id: metro
        run: echo "path=$(node -p "require('os').tmpdir()")/metro-cache" >> "$GITHUB_OUTPUT"

      - name: Restore Metro cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.metro.outputs.path }}
          key: metro-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            metro-${{ runner.os }}-

      - name: Capture
        run: node scripts/ui-snapshots.mjs capture --platform ios --app build/ui-snapshots/Cohub-ios-simulator.zip --out dist/ui-snapshots/ios --target "${{ inputs.target }}" --perf "${{ inputs.perf }}" --themes "${{ inputs.themes }}" $SCREENS_ARG $MOTION_ARG $ORIENTATIONS_ARG

      # A cancelled capture never reaches the script's own redaction, and Maestro and the simulator
      # log typed text; this repository is public.
      - name: Redact credentials
        if: always()
        run: node scripts/ui-snapshots.mjs redact --dir dist/ui-snapshots/ios

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            dist/ui-snapshots/ios
            !dist/ui-snapshots/ios/app
            !**/commands.json
            !**/*.log
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

      - name: Save Metro cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.metro.outputs.path }}
          key: metro-${{ runner.os }}-${{ github.run_id }}
