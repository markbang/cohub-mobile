name: UI Snapshots (iOS)

# Captures the screens on an iOS simulator, the reference for ui-snapshots-android.yml. A prepare job
# builds the simulator app once per native fingerprint and caches it; each target then captures in its
# own job, so phone and tablet run side by side. The simulator app is cached by native fingerprint and
# loads the branch's JS from Metro, so a JS-only change skips the native build.
on:
  workflow_dispatch:
    inputs:
      screens:
        description: Screens to capture, comma-separated (see SCREENS in scripts/ui-snapshots.mjs). Defaults to all.
        required: false
        type: string
      themes:
        description: Themes to capture.
        required: false
        default: light,dark
        type: string
      motion:
        description: Also record the interactions in MOTIONS as videos (phone only).
        required: false
        default: true
        type: boolean
      target:
        description: The device classes, comma-separated (phone, tablet, or phone,tablet). Each target captures in its own job, and the jobs run in parallel. tablet runs the split layout in both orientations, then the e2e/tablet flow.
        required: false
        default: phone
        type: string
      orientations:
        description: Orientations to capture, comma-separated. Defaults to portrait on a phone and portrait,landscape on a tablet.
        required: false
        type: string
      text_size:
        description: Dynamic Type content sizes, comma-separated (default, extra-large, accessibility-large). Each size is restored to default after its cell; a non-default size writes to a suffixed theme directory.
        required: false
        default: default
        type: string
      offline:
        description: Render the debug fixtures without an account (no sign-in). Required when the account's sign-in is challenged.
        required: false
        default: false
        type: boolean
      perf:
        description: Frame-probe runs of the perf sequence (0 skips it).
        required: false
        default: "0"
        type: string
      ios:
        description: The iOS the reference runs on. 27 uses GitHub's xcode-27 image (a preview); 26 the default macOS image.
        required: false
        default: "27"
        type: choice
        options:
          - "27"
          - "26"

permissions:
  contents: read

env:
  CI: "true"
  EXPO_NO_TELEMETRY: "1"
  EXPO_PUBLIC_COHUB_ENV: dev
  E2E_ACCOUNT_EMAIL: ${{ secrets.E2E_ACCOUNT_EMAIL }}
  E2E_ACCOUNT_PASSWORD: ${{ secrets.E2E_ACCOUNT_PASSWORD }}
  SCREENS_ARG: ${{ inputs.screens && format('--screens {0}', inputs.screens) || '' }}
  MOTION_ARG: ${{ !inputs.motion && '--no-motion' || '' }}
  ORIENTATIONS_ARG: ${{ inputs.orientations && format('--orientations {0}', inputs.orientations) || '' }}
  OFFLINE_ARG: ${{ inputs.offline && '--offline' || '' }}
  # Hosted macOS runners can take minutes to start Maestro's XCTest driver.
  MAESTRO_DRIVER_STARTUP_TIMEOUT: "240000"

jobs:
  prepare:
    name: iOS simulator app
    # The app is matched to iOS 27; GitHub ships its simulator only on the xcode-27 image.
    runs-on: ${{ inputs.ios == '26' && 'macos-latest' || 'xcode-27' }}
    timeout-minutes: 120
    # One build per ref at a time; a second dispatch waits for the first and then restores its app.
    concurrency:
      group: ui-snapshots-ios-app-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      key: ${{ steps.app.outputs.cache-primary-key }}
      built: ${{ steps.app.outputs.cache-hit != 'true' }}
    steps:
      # Fails the run before any build when the target input is not phone, tablet, or both.
      - name: Targets
        id: targets
        env:
          TARGET: ${{ inputs.target }}
        run: |
          targets=$(printf '%s' "$TARGET" | jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0)) | unique')
          if ! echo "$targets" | jq -e 'length > 0 and all(. == "phone" or . == "tablet")' > /dev/null; then
            echo "::error::target must be phone, tablet, or phone,tablet; got \"$TARGET\"."
            exit 1
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "Capture targets: $targets"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Native fingerprint
        id: fingerprint
        run: |
          echo "hash=$(bunx --no-install @expo/fingerprint fingerprint:generate --platform ios | jq -r .hash)" >> "$GITHUB_OUTPUT"
          echo "xcode=$(xcodebuild -version | awk 'NR==2 {print $3}')" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Restore simulator app
        id: app
        uses: actions/cache/restore@v6
        with:
          path: build/ui-snapshots/Cohub-ios-simulator.zip
          # Bump the version when the simulator build settings change; they are not in the fingerprint.
          # The Xcode build is in the key: an app built by one Xcode is not reused under another's simulator.
          # The app version is too: the fingerprint leaves it out, and Me shows the binary's version.
          key: ui-snapshots-ios-v3-${{ steps.fingerprint.outputs.xcode }}-${{ steps.fingerprint.outputs.hash }}-${{ steps.fingerprint.outputs.version }}

      # CocoaPods' download cache, mostly React Native's prebuilt frameworks. pod install still
      # resolves and generates the Pods project from node_modules on every run.
      - name: Restore CocoaPods cache
        if: steps.app.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            cocoapods-${{ runner.os }}-

      - name: Build simulator app
        if: steps.app.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          bun run native:ios:prepare
          bun run native:ios:build
          mkdir -p build/ui-snapshots
          cp build/artifacts/Cohub-ios-simulator.zip build/ui-snapshots/

      - name: Save simulator app
        if: steps.app.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/ui-snapshots/Cohub-ios-simulator.zip
          key: ${{ steps.app.outputs.cache-primary-key }}

      # The capture jobs take the app from here when it was built, so they do not wait on a cache save.
      - name: Upload simulator app
        if: steps.app.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ui-snapshots-ios-app
          path: build/ui-snapshots/Cohub-ios-simulator.zip
          if-no-files-found: error
          retention-days: 1

  capture:
    name: iOS simulator (${{ matrix.target }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.targets) }}
    runs-on: ${{ inputs.ios == '26' && 'macos-latest' || 'xcode-27' }}
    timeout-minutes: 120
    # Each target has its own group, so the matrix jobs of one run never cancel each other.
    concurrency:
      group: ui-snapshots-ios-${{ matrix.target }}-${{ inputs.text_size }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # prepare has saved node_modules by now; a capture that misses it installs without saving.
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          save-cache: "false"

      - name: Download simulator app
        if: needs.prepare.outputs.built == 'true'
        uses: actions/download-artifact@v8
        with:
          name: ui-snapshots-ios-app
          path: build/ui-snapshots

      - name: Restore simulator app
        if: needs.prepare.outputs.built != 'true'
        uses: actions/cache/restore@v6
        with:
          path: build/ui-snapshots/Cohub-ios-simulator.zip
          key: ${{ needs.prepare.outputs.key }}
          fail-on-cache-miss: true

      - name: Install Maestro
        run: |
          set -euo pipefail
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Metro's transform cache makes the app's first bundle fast; a cold one can outlast the app's wait.
      - name: Locate Metro cache
        id: metro
        run: echo "path=$(node -p "require('os').tmpdir()")/metro-cache" >> "$GITHUB_OUTPUT"

      - name: Restore Metro cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.metro.outputs.path }}
          key: metro-${{ runner.os }}-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            metro-${{ runner.os }}-${{ matrix.target }}-

      - name: Capture
        run: node scripts/ui-snapshots.mjs capture --platform ios --app build/ui-snapshots/Cohub-ios-simulator.zip --out dist/ui-snapshots/ios --target "${{ matrix.target }}" --text-size "${{ inputs.text_size }}" --perf "${{ inputs.perf }}" --themes "${{ inputs.themes }}" $SCREENS_ARG $MOTION_ARG $ORIENTATIONS_ARG $OFFLINE_ARG

      # A cancelled capture never reaches the script's own redaction, and Maestro and the simulator
      # log typed text; this repository is public.
      - name: Redact credentials
        if: always()
        run: node scripts/ui-snapshots.mjs redact --dir dist/ui-snapshots/ios

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target == 'tablet' && 'ui-snapshots-ios-tablet' || 'ui-snapshots-ios' }}
          path: |
            dist/ui-snapshots/ios
            !dist/ui-snapshots/ios/app
            !**/commands.json
            !**/*.log
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

      - name: Save Metro cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.metro.outputs.path }}
          key: metro-${{ runner.os }}-${{ matrix.target }}-${{ github.run_id }}
