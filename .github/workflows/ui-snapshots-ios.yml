name: UI Snapshots (iOS)

# Captures the screens on an iOS simulator, the reference for ui-snapshots-android.yml. A prepare job
# builds the simulator app once per native fingerprint, caches it and plans the capture jobs
# (`scripts/ui-snapshots.mjs plan`). Each job captures one slice of one target on its own simulator, so
# the jobs run side by side. A merge job combines them into the `ui-snapshots-ios` (phone) and
# `ui-snapshots-ios-tablet` artifacts. The simulator app is cached by native fingerprint and loads the
# branch's JS from Metro, so a JS-only change skips the native build.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: core (the default) captures the core set that fits the 15-minute budget (CORE in scripts/ui-snapshots.mjs). full captures every screen, and the split flows on the tablet.
        required: false
        default: core
        type: choice
        options:
          - core
          - full
      screens:
        description: Screens to capture, comma-separated (see SCREENS in scripts/ui-snapshots.mjs). Overrides the scope's screens, at each text size requested.
        required: false
        type: string
      themes:
        description: Themes to capture.
        required: false
        default: light,dark
        type: string
      motion:
        description: Also record the interactions in MOTIONS as videos (phone only).
        required: false
        default: true
        type: boolean
      target:
        description: The device classes, comma-separated (phone, tablet, or phone,tablet). The screens are sliced into jobs that run in parallel (see the plan step). tablet runs the split layout in both orientations, then the e2e/tablet flow.
        required: false
        default: phone
        type: string
      orientations:
        description: Orientations to capture, comma-separated. Defaults to portrait on a phone and portrait,landscape on a tablet.
        required: false
        type: string
      text_size:
        description: Dynamic Type content sizes, comma-separated (default, extra-large, accessibility-large). Blank takes the scope's own sizes (core has the default size and the composer screens at accessibility-large; full the default size). Each size is restored to default after its cell; a non-default size writes to a suffixed theme directory.
        required: false
        type: string
      offline:
        description: Render the debug fixtures without an account (no sign-in). On by default because the tenant's CAPTCHA blocks the login flow; set false to sign in.
        required: false
        default: true
        type: boolean
      perf:
        description: Frame-probe runs of the perf sequence (0 skips it).
        required: false
        default: "0"
        type: string
      ios:
        description: The iOS the reference runs on. 27 uses GitHub's xcode-27 image (a preview); 26 the default macOS image.
        required: false
        default: "27"
        type: choice
        options:
          - "27"
          - "26"

permissions:
  contents: read

env:
  CI: "true"
  EXPO_NO_TELEMETRY: "1"
  EXPO_PUBLIC_COHUB_ENV: dev
  E2E_ACCOUNT_EMAIL: ${{ secrets.E2E_ACCOUNT_EMAIL }}
  E2E_ACCOUNT_PASSWORD: ${{ secrets.E2E_ACCOUNT_PASSWORD }}
  OFFLINE_ARG: ${{ inputs.offline && '--offline' || '' }}
  # Pinned so the Maestro install prepare caches is reproducible; capture jobs restore it by this version.
  MAESTRO_VERSION: "2.12.1"
  # Driver starts that came up took 35 s to 285 s in the last 15 runs; the watchdog adds a minute.
  MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"

jobs:
  prepare:
    name: iOS simulator app
    # The app is matched to iOS 27; GitHub ships its simulator only on the xcode-27 image.
    runs-on: ${{ inputs.ios == '26' && 'macos-latest' || 'xcode-27' }}
    timeout-minutes: 120
    # One build per ref at a time; a second dispatch waits for the first and then restores its app.
    concurrency:
      group: ui-snapshots-ios-app-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      key: ${{ steps.app.outputs.cache-primary-key }}
      built: ${{ steps.app.outputs.cache-hit != 'true' }}
      modules-key: ${{ steps.deps.outputs.cache-key }}
    steps:
      # Fails the run before any build when the target input is not phone, tablet, or both.
      - name: Targets
        env:
          TARGET: ${{ inputs.target }}
        run: |
          targets=$(printf '%s' "$TARGET" | jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0)) | unique')
          if ! echo "$targets" | jq -e 'length > 0 and all(. == "phone" or . == "tablet")' > /dev/null; then
            echo "::error::target must be phone, tablet, or phone,tablet; got \"$TARGET\"."
            exit 1
          fi
          echo "Capture targets: $targets"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        id: deps
        uses: ./.github/actions/install-dependencies

      # Capture jobs restore this install rather than downloading it. The version is in the key, so a bump re-caches it.
      - name: Restore Maestro
        id: maestro
        uses: actions/cache@v6
        with:
          path: ~/.maestro
          key: maestro-${{ runner.os }}-${{ env.MAESTRO_VERSION }}

      - name: Install Maestro
        if: steps.maestro.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -Ls "https://get.maestro.mobile.dev" | bash

      # Metro's transform cache is shared through this run: prepare warms it with the app's first bundle and saves
      # it, and every capture job restores that save. The key is per run, so a new run starts from the newest save
      # for the same lockfile and transforms only what changed. A cold first bundle takes minutes on a macOS runner.
      - name: Locate Metro cache
        id: metro
        run: echo "path=$(node -p "require('os').tmpdir()")/metro-cache" >> "$GITHUB_OUTPUT"

      - name: Restore Metro cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.metro.outputs.path }}
          key: metro-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.run_id }}
          restore-keys: |
            metro-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      - name: Warm Metro
        run: node scripts/ui-snapshots.mjs warm --platform ios $OFFLINE_ARG

      - name: Save Metro cache
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.metro.outputs.path }}
          key: metro-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.run_id }}

      - name: Plan capture jobs
        id: plan
        env:
          TARGET: ${{ inputs.target }}
          SCOPE: ${{ inputs.scope }}
          SCREENS: ${{ inputs.screens }}
          ORIENTATIONS: ${{ inputs.orientations }}
          THEMES: ${{ inputs.themes }}
          TEXT_SIZE: ${{ inputs.text_size }}
          MOTION: ${{ inputs.motion }}
          PERF: ${{ inputs.perf }}
        run: |
          args=(--target "$TARGET" --scope "$SCOPE" --themes "$THEMES" --perf "$PERF")
          if [ -n "$TEXT_SIZE" ]; then args+=(--text-size "$TEXT_SIZE"); fi
          if [ -n "$SCREENS" ]; then args+=(--screens "$SCREENS"); fi
          if [ -n "$ORIENTATIONS" ]; then args+=(--orientations "$ORIENTATIONS"); fi
          if [ "$MOTION" != "true" ]; then args+=(--no-motion); fi
          shards=$(node scripts/ui-snapshots.mjs plan "${args[@]}")
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "$shards" | jq -r '.[] | "\(.artifact): \(.target) \(.orientations | join(",")) \(.textSize) \(.part), \(.screens | length) screens"'

      - name: Native fingerprint
        id: fingerprint
        run: |
          echo "hash=$(bunx --no-install @expo/fingerprint fingerprint:generate --platform ios | jq -r .hash)" >> "$GITHUB_OUTPUT"
          echo "xcode=$(xcodebuild -version | awk 'NR==2 {print $3}')" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Restore simulator app
        id: app
        uses: actions/cache/restore@v6
        with:
          path: build/ui-snapshots/Cohub-ios-simulator.zip
          # Bump the version when the simulator build settings change; they are not in the fingerprint.
          # The Xcode build is in the key: an app built by one Xcode is not reused under another's simulator.
          # The app version is too: the fingerprint leaves it out, and Me shows the binary's version.
          key: ui-snapshots-ios-v3-${{ steps.fingerprint.outputs.xcode }}-${{ steps.fingerprint.outputs.hash }}-${{ steps.fingerprint.outputs.version }}

      # CocoaPods' download cache, mostly React Native's prebuilt frameworks. pod install still
      # resolves and generates the Pods project from node_modules on every run.
      - name: Restore CocoaPods cache
        if: steps.app.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            cocoapods-${{ runner.os }}-

      - name: Build simulator app
        if: steps.app.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          bun run native:ios:prepare
          bun run native:ios:build
          mkdir -p build/ui-snapshots
          cp build/artifacts/Cohub-ios-simulator.zip build/ui-snapshots/

      - name: Save simulator app
        if: steps.app.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/ui-snapshots/Cohub-ios-simulator.zip
          key: ${{ steps.app.outputs.cache-primary-key }}

      # The capture jobs take the app from here when it was built, so they do not wait on a cache save.
      - name: Upload simulator app
        if: steps.app.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ui-snapshots-ios-app
          path: build/ui-snapshots/Cohub-ios-simulator.zip
          if-no-files-found: error
          retention-days: 1

  capture:
    name: iOS ${{ matrix.target }} ${{ join(matrix.orientations, ',') }} ${{ matrix.textSize }} ${{ matrix.part }} (${{ matrix.shard }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.shards) }}
    runs-on: ${{ inputs.ios == '26' && 'macos-latest' || 'xcode-27' }}
    timeout-minutes: 120
    # Each job has its own group, so the jobs never share one. Nothing is cancelled: a re-dispatch waits for the running capture.
    concurrency:
      group: ui-snapshots-ios-${{ matrix.artifact }}-${{ inputs.text_size }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The simulator boots for minutes, and `simctl boot` returns once the boot is requested: it runs under the
      # restores and Metro's start. The driver warm-up and the capture step wait for it (bootstatus).
      - name: Boot simulator
        run: node scripts/ui-snapshots.mjs boot --platform ios --target "${{ matrix.target }}"

      # prepare saved Maestro under this version; a miss means prepare did not, so the job fails.
      - name: Restore Maestro
        uses: actions/cache/restore@v6
        with:
          path: ~/.maestro
          key: maestro-${{ runner.os }}-${{ env.MAESTRO_VERSION }}
          fail-on-cache-miss: true

      - name: Add Maestro to PATH
        run: echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Maestro's driver takes minutes to start on a fresh simulator. This starts it once in the background, while the
      # dependencies, the app and Metro restore; the capture step waits for it, then starts its own driver.
      - name: Warm the driver
        run: |
          ( node scripts/ui-snapshots.mjs driver --platform ios --target "${{ matrix.target }}" ) > "$RUNNER_TEMP/driver-warm.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/driver-warm.pid"

      # prepare saved node_modules under the key it reported; a miss fails the job rather than installing.
      - name: Restore dependencies
        uses: ./.github/actions/restore-dependencies
        with:
          cache-key: ${{ needs.prepare.outputs.modules-key }}

      - name: Download simulator app
        if: needs.prepare.outputs.built == 'true'
        uses: actions/download-artifact@v8
        with:
          name: ui-snapshots-ios-app
          path: build/ui-snapshots

      - name: Restore simulator app
        if: needs.prepare.outputs.built != 'true'
        uses: actions/cache/restore@v6
        with:
          path: build/ui-snapshots/Cohub-ios-simulator.zip
          key: ${{ needs.prepare.outputs.key }}
          fail-on-cache-miss: true

      # Metro's transform cache, saved by prepare in this run: the app's first bundle starts from transforms already done.
      - name: Locate Metro cache
        id: metro
        run: echo "path=$(node -p "require('os').tmpdir()")/metro-cache" >> "$GITHUB_OUTPUT"

      - name: Restore Metro cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.metro.outputs.path }}
          key: metro-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.run_id }}
          restore-keys: |
            metro-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      - name: Wait for the driver warm-up
        run: |
          pid=$(cat "$RUNNER_TEMP/driver-warm.pid")
          while kill -0 "$pid" 2>/dev/null; do sleep 2; done
          cat "$RUNNER_TEMP/driver-warm.log"

      - name: Capture
        env:
          SCREENS_ARG: ${{ join(matrix.screens, ',') && format('--screens {0}', join(matrix.screens, ',')) || '' }}
        run: node scripts/ui-snapshots.mjs capture --platform ios --app build/ui-snapshots/Cohub-ios-simulator.zip --out dist/ui-snapshots/ios --target "${{ matrix.target }}" --orientations "${{ join(matrix.orientations, ',') }}" --part "${{ matrix.part }}" --text-size "${{ matrix.textSize }}" --perf "${{ inputs.perf }}" --themes "${{ inputs.themes }}" $SCREENS_ARG $OFFLINE_ARG

      # A cancelled capture never reaches the script's own redaction, and Maestro and the simulator
      # log typed text; this repository is public.
      - name: Redact credentials
        if: always()
        run: node scripts/ui-snapshots.mjs redact --dir dist/ui-snapshots/ios

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/ui-snapshots/ios
            !dist/ui-snapshots/ios/app
            !**/commands.json
            !**/*.log
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  # Runs when a capture job failed, so the jobs that passed stay downloadable. Missing captures are listed in
  # MISSING.txt in their artifact, and the merge fails the run.
  merge:
    name: iOS snapshots (merged)
    needs: [prepare, capture]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # A run whose jobs all failed uploads nothing; the merge then lists every capture as missing.
      # Each job's artifact is downloaded by its exact name into a folder of its own. A pattern is not used: with one
      # artifact matching it unpacks flat, and the merge then reads the folder as missing. A job that did not upload
      # has no artifact; the merge lists it.
      - name: Download captures
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN: ${{ needs.prepare.outputs.shards }}
        run: |
          mkdir -p dist/ui-snapshots/shards
          for artifact in $(printf '%s' "$PLAN" | jq -r '.[].artifact'); do
            if gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "dist/ui-snapshots/shards/$artifact"; then
              echo "Downloaded $artifact"
            else
              echo "::warning::$artifact did not upload; the merge lists its captures as missing."
            fi
          done

      - name: Merge captures
        env:
          PLAN: ${{ needs.prepare.outputs.shards }}
          THEMES: ${{ inputs.themes }}
        run: |
          set -euo pipefail
          printf '%s' "$PLAN" > plan.json
          node scripts/ui-snapshots.mjs merge --plan plan.json --shards dist/ui-snapshots/shards --out dist/ui-snapshots/merged --themes "$THEMES"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-snapshots-ios
          path: dist/ui-snapshots/merged/ui-snapshots-ios
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

      - name: Upload tablet screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-snapshots-ios-tablet
          path: dist/ui-snapshots/merged/ui-snapshots-ios-tablet
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
