name: Publish Web App

# The Bot mode web App is a Cohub App in the Mobile Space (https://cohub.live/bangwu/cohubbot-mobile/w/bots).
# Cohub issues no tokens to CI, so this job builds the site and asks the Space to publish it: the Space's
# `.cohub/hooks/publish-web.yml` webhook downloads this run's artifact, publishes it as the Space owner and
# reports back as the "Web App" commit status, which the last step waits for.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

concurrency:
  group: publish-web
  cancel-in-progress: false

env:
  CI: "true"
  EXPO_NO_TELEMETRY: "1"
  APP_URL: https://cohub.live/bangwu/cohubbot-mobile/w/bots

jobs:
  publish:
    name: Publish
    if: github.repository == 'markbang/cohub-mobile' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        id: node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            modules/react-native-enriched-markdown/cpp/highlight/vendor/grammars
            modules/react-native-enriched-markdown/cpp/highlight/vendor/tree-sitter
            modules/react-native-enriched-markdown/ios/vendor
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json', 'modules/*/package.json', 'modules/react-native-enriched-markdown/*.mjs', 'modules/react-native-enriched-markdown/ratex-version.json', 'modules/react-native-enriched-markdown/cpp/highlight/grammar-versions.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build web App
        run: node scripts/web-app.mjs dist/web

      - name: Upload web App
        uses: actions/upload-artifact@v7
        with:
          name: cohub-web-${{ github.sha }}
          path: dist/web
          if-no-files-found: error
          retention-days: 7

      - name: Ask the Mobile Space to publish
        env:
          HOOK_URL: ${{ secrets.COHUB_WEB_HOOK_URL }}
          HOOK_SECRET: ${{ secrets.COHUB_WEB_HOOK_SECRET }}
        run: |
          if [ -z "$HOOK_URL" ] || [ -z "$HOOK_SECRET" ]; then
            echo "::error title=Web App not published::Set the COHUB_WEB_HOOK_URL and COHUB_WEB_HOOK_SECRET secrets (cohub -s cohubbot-mobile spaces webhooks url publish-web)."
            exit 1
          fi
          curl -fsS -X POST "$HOOK_URL" -H "x-cohub-webhook-secret: $HOOK_SECRET" -H 'content-type: application/json' \
            -d "{\"sha\":\"$GITHUB_SHA\",\"runId\":$GITHUB_RUN_ID}"

      - name: Wait for the publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 100); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/statuses" --jq '[.[] | select(.context == "Web App")][0].state // ""')
            case "$state" in
              success) echo "Published $APP_URL"; echo "Published [$APP_URL]($APP_URL) at $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"; exit 0 ;;
              failure|error) echo "::error title=Web App not published::The Mobile Space hook failed; its run is in the Space's task history."; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error title=Web App not published::No \"Web App\" status after 25 minutes; check the Mobile Space hook."
          exit 1
