name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  EXPO_NO_TELEMETRY: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Validate PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bun scripts/check-pr-title.mjs "$PR_TITLE"

      # Runs every check in parallel and reports each failure. Publish OTA and Native Release
      # gate on the same script, so a check added there runs here too.
      - name: Run quality checks
        run: bun run verify

      - name: Audit production dependencies
        run: bun scripts/check-audit.mjs

  # Runs alongside Quality: the export does not read lint/typecheck results, and
  # serializing the two added ~70s to every pull request.
  # A main push skips it: Publish OTA exports the same commit for both platforms.
  bundle:
    name: Bundle (${{ matrix.platform }})
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios, web]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      # Metro keys transforms by content and the inlined EXPO_PUBLIC_* values, so a cache from
      # another commit, or Publish OTA's main export, only skips unchanged work.
      - name: Locate Metro cache
        id: metro
        run: echo "path=$(node -p "require('os').tmpdir()")/metro-cache" >> "$GITHUB_OUTPUT"

      - name: Restore Metro cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.metro.outputs.path }}
          key: metro-ci-${{ runner.os }}-${{ matrix.platform }}-${{ hashFiles('bun.lock') }}-${{ github.run_id }}
          restore-keys: |
            metro-ci-${{ runner.os }}-${{ matrix.platform }}-${{ hashFiles('bun.lock') }}-
            metro-ota-${{ runner.os }}-${{ matrix.platform }}-${{ hashFiles('bun.lock') }}-

      # The web build is the Bot mode Cohub App (Publish Web App); its script also checks the output.
      - name: Export ${{ matrix.platform }} bundle
        run: |
          if [ "${{ matrix.platform }}" = web ]; then node scripts/web-app.mjs dist/web; else bunx expo export --platform "${{ matrix.platform }}" --output-dir "dist/${{ matrix.platform }}"; fi

      - name: Save Metro cache
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.metro.outputs.path }}
          key: metro-ci-${{ runner.os }}-${{ matrix.platform }}-${{ hashFiles('bun.lock') }}-${{ github.run_id }}

      - name: Upload ${{ matrix.platform }} bundle
        uses: actions/upload-artifact@v7
        with:
          name: cohub-mobile-${{ matrix.platform }}-${{ github.sha }}
          path: dist/${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
