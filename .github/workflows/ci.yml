name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  EXPO_NO_TELEMETRY: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        id: node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # file: dependencies (modules/*) install as symlinks into the checkout, so the cache holds
      # only the links; their package.json files are in the key for the dependencies they declare.
      # The vendored Markdown renderer's postinstall downloads native sources into its checkout
      # folder; they are cached alongside, as both native builds and the OTA fingerprint read them.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            modules/react-native-enriched-markdown/cpp/highlight/vendor/grammars
            modules/react-native-enriched-markdown/cpp/highlight/vendor/tree-sitter
            modules/react-native-enriched-markdown/ios/vendor
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json', 'modules/*/package.json', 'modules/react-native-enriched-markdown/*.mjs', 'modules/react-native-enriched-markdown/ratex-version.json', 'modules/react-native-enriched-markdown/cpp/highlight/grammar-versions.json') }}

      # The postinstall only warns when a download fails; an incomplete set is never cached.
      - name: Install dependencies
        id: npm-ci
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: |
          npm ci
          vendor=modules/react-native-enriched-markdown
          if [ -f "$vendor/cpp/highlight/vendor/grammars/.stamp" ] && [ -f "$vendor/cpp/highlight/vendor/tree-sitter/.stamp" ] && [ -f "$vendor/ios/vendor/.stamp" ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          fi

      # Saved before anything else runs: later steps write build output into node_modules.
      - name: Save node_modules
        if: steps.npm-ci.outputs.complete == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            node_modules
            modules/react-native-enriched-markdown/cpp/highlight/vendor/grammars
            modules/react-native-enriched-markdown/cpp/highlight/vendor/tree-sitter
            modules/react-native-enriched-markdown/ios/vendor
          key: ${{ steps.node-modules.outputs.cache-primary-key }}

      - name: Validate PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-pr-title.mjs "$PR_TITLE"

      # Runs the commands of `npm run check`, with ESLint's cache and tsc's incremental build info
      # kept between runs. ESLint does not re-lint an unchanged file when a file it imports changes;
      # Publish OTA's check job runs the uncached `npm run check` before anything ships.
      - name: Restore lint caches
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/lint-cache
          key: lint-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            lint-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Run quality checks
        env:
          LINT_CACHE: ${{ runner.temp }}/lint-cache
        run: |
          set -euo pipefail
          expected='npm run lint && npm run typecheck && npm run test:workflow && node scripts/check-expo-go-notifications.mjs && npm run release:check && npm run doctor'
          actual=$(node -p 'require("./package.json").scripts.check')
          if [ "$actual" != "$expected" ]; then
            echo "::error title=Quality steps out of date::package.json scripts.check changed. Update 'Run quality checks' in .github/workflows/ci.yml to run the same commands."
            exit 1
          fi
          npm run lint -- --cache --cache-strategy content --cache-location "$LINT_CACHE/eslint"
          npm run typecheck -- --incremental --tsBuildInfoFile "$LINT_CACHE/tsbuildinfo"
          npm run test:workflow
          node scripts/check-expo-go-notifications.mjs
          npm run release:check
          npm run doctor

      - name: Save lint caches
        if: success() || failure()
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/lint-cache
          key: lint-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}

      # Not in `npm run check`: package.json scripts are part of the OTA fingerprint, so adding
      # one would strand installed builds. Fold it in with the next native release.
      - name: Check design tokens
        run: node --no-warnings --experimental-strip-types scripts/design-tokens.mjs --check

      - name: Check design system usage
        run: node scripts/check-design-system.mjs

      - name: Check module graph
        run: node scripts/check-module-graph.mjs

      - name: Check open-source license list
        run: node scripts/open-source-licenses.mjs --check

      - name: Audit production dependencies
        run: node scripts/check-audit.mjs

  # Runs alongside Quality: the export does not read lint/typecheck results, and
  # serializing the two added ~70s to every pull request.
  # A main push skips it: Publish OTA exports the same commit for both platforms.
  bundle:
    name: Bundle (${{ matrix.platform }})
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        id: node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # file: dependencies (modules/*) install as symlinks into the checkout, so the cache holds
      # only the links; their package.json files are in the key for the dependencies they declare.
      # The vendored Markdown renderer's postinstall downloads native sources into its checkout
      # folder; they are cached alongside, as both native builds and the OTA fingerprint read them.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            modules/react-native-enriched-markdown/cpp/highlight/vendor/grammars
            modules/react-native-enriched-markdown/cpp/highlight/vendor/tree-sitter
            modules/react-native-enriched-markdown/ios/vendor
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json', 'modules/*/package.json', 'modules/react-native-enriched-markdown/*.mjs', 'modules/react-native-enriched-markdown/ratex-version.json', 'modules/react-native-enriched-markdown/cpp/highlight/grammar-versions.json') }}

      # The postinstall only warns when a download fails; an incomplete set is never cached.
      - name: Install dependencies
        id: npm-ci
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: |
          npm ci
          vendor=modules/react-native-enriched-markdown
          if [ -f "$vendor/cpp/highlight/vendor/grammars/.stamp" ] && [ -f "$vendor/cpp/highlight/vendor/tree-sitter/.stamp" ] && [ -f "$vendor/ios/vendor/.stamp" ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          fi

      # Saved before anything else runs: later steps write build output into node_modules.
      - name: Save node_modules
        if: steps.npm-ci.outputs.complete == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            node_modules
            modules/react-native-enriched-markdown/cpp/highlight/vendor/grammars
            modules/react-native-enriched-markdown/cpp/highlight/vendor/tree-sitter
            modules/react-native-enriched-markdown/ios/vendor
          key: ${{ steps.node-modules.outputs.cache-primary-key }}

      # Metro keys transforms by content and the inlined EXPO_PUBLIC_* values, so a cache from
      # another commit, or Publish OTA's main export, only skips unchanged work.
      - name: Locate Metro cache
        id: metro
        run: echo "path=$(node -p "require('os').tmpdir()")/metro-cache" >> "$GITHUB_OUTPUT"

      - name: Restore Metro cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.metro.outputs.path }}
          key: metro-ci-${{ runner.os }}-${{ matrix.platform }}-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            metro-ci-${{ runner.os }}-${{ matrix.platform }}-${{ hashFiles('package-lock.json') }}-
            metro-ota-${{ runner.os }}-${{ matrix.platform }}-${{ hashFiles('package-lock.json') }}-

      - name: Export ${{ matrix.platform }} bundle
        run: npx expo export --platform "${{ matrix.platform }}" --output-dir "dist/${{ matrix.platform }}"

      - name: Save Metro cache
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.metro.outputs.path }}
          key: metro-ci-${{ runner.os }}-${{ matrix.platform }}-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}

      - name: Upload ${{ matrix.platform }} bundle
        uses: actions/upload-artifact@v7
        with:
          name: cohub-mobile-${{ matrix.platform }}-${{ github.sha }}
          path: dist/${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
