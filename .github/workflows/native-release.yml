name: Native Release

on:
  workflow_call:
    inputs:
      platform:
        description: Platform to build
        required: false
        type: string
        default: android
      profile:
        description: Native build profile (distribution is a signed direct-download APK; production is for store artifacts)
        required: false
        type: string
        default: distribution
      submit:
        description: Submit completed artifacts to the stores
        required: false
        type: boolean
        default: false
      android_track:
        description: Google Play track
        required: false
        type: string
        default: internal
      release_tag:
        description: Required vX.Y.Z tag for distribution and production builds
        required: true
        type: string
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      COHUB_GOOGLE_SERVICES_JSON_BASE64:
        required: false
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:
        required: false
      APPSTORE_CERTIFICATES_FILE_BASE64:
        required: false
      APPSTORE_CERTIFICATES_PASSWORD:
        required: false
      APPSTORE_API_PRIVATE_KEY:
        required: false
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: Native build profile
        required: true
        type: choice
        options: [distribution, production]
        default: distribution
      submit:
        description: Submit completed artifacts to the stores
        required: true
        type: boolean
        default: false
      android_track:
        description: Google Play track
        required: true
        type: choice
        options: [internal, production]
        default: internal
      release_tag:
        description: Required for distribution and production, for example v1.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-release-${{ inputs.profile || 'production' }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: false

env:
  CI: "true"
  EXPO_NO_TELEMETRY: "1"

jobs:
  metadata:
    name: Validate release target
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve and validate target ref
        id: target
        env:
          PROFILE: ${{ inputs.profile }}
          PLATFORM: ${{ inputs.platform }}
          SUBMIT: ${{ inputs.submit }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            android|ios|all) ;;
            *) echo "Unsupported platform: $PLATFORM"; exit 1 ;;
          esac
          case "$PROFILE" in
            distribution|production) ;;
            *) echo "Unsupported native build profile: $PROFILE"; exit 1 ;;
          esac
          if [[ "$PROFILE" == "distribution" && "$PLATFORM" != "android" ]]; then
            echo "The distribution profile only supports platform=android."
            exit 1
          fi
          if [[ "$PROFILE" == "distribution" && "$SUBMIT" == "true" ]]; then
            echo "The distribution profile cannot submit to a store. Use production after configuring store credentials."
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release builds require a stable release tag such as v1.2.0. The ref input is ignored."
            exit 1
          fi
          git fetch --no-tags origin main
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tag_sha=$(git rev-list -n 1 "$RELEASE_TAG^{commit}")
          main_sha=$(git rev-parse origin/main)
          if ! git merge-base --is-ancestor "$tag_sha" "$main_sha"; then
            echo "Release tag $RELEASE_TAG is not reachable from origin/main. Refusing to use signing credentials."
            exit 1
          fi
          echo "sha=$tag_sha" >> "$GITHUB_OUTPUT"
          echo "Using protected main-history tag $RELEASE_TAG at $tag_sha."

  # Runs beside the platform builds; store submissions and Native Tag Release's GitHub Release
  # upload wait for it.
  check:
    name: Quality checks
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_PUBLIC_UPDATES_URL: ${{ vars.EXPO_PUBLIC_UPDATES_URL }}
    steps:
      - name: Checkout validated ref
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.target_sha }}

      - name: Set up Node
        id: node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # file: dependencies (modules/*) install as symlinks into the checkout, so the cache holds
      # only the links; their package.json files are in the key for the dependencies they declare.
      # The vendored Markdown renderer's postinstall downloads native sources into its checkout
      # folder; they are cached alongside, as both native builds and the OTA fingerprint read them.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            modules/react-native-enriched-markdown/cpp/highlight/vendor/grammars
            modules/react-native-enriched-markdown/cpp/highlight/vendor/tree-sitter
            modules/react-native-enriched-markdown/ios/vendor
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json', 'modules/*/package.json', 'modules/react-native-enriched-markdown/*.mjs', 'modules/react-native-enriched-markdown/ratex-version.json', 'modules/react-native-enriched-markdown/cpp/highlight/grammar-versions.json') }}

      # The postinstall only warns when a download fails; an incomplete set is never cached.
      - name: Install dependencies
        id: npm-ci
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: |
          npm ci
          vendor=modules/react-native-enriched-markdown
          if [ -f "$vendor/cpp/highlight/vendor/grammars/.stamp" ] && [ -f "$vendor/cpp/highlight/vendor/tree-sitter/.stamp" ] && [ -f "$vendor/ios/vendor/.stamp" ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          fi

      # Saved before anything else runs: later steps write build output into node_modules.
      - name: Save node_modules
        if: steps.npm-ci.outputs.complete == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            node_modules
            modules/react-native-enriched-markdown/cpp/highlight/vendor/grammars
            modules/react-native-enriched-markdown/cpp/highlight/vendor/tree-sitter
            modules/react-native-enriched-markdown/ios/vendor
          key: ${{ steps.node-modules.outputs.cache-primary-key }}

      - name: Run quality checks
        run: npm run check

  android:
    name: Android ${{ inputs.profile }}
    needs: metadata
    if: inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      EXPO_PUBLIC_UPDATES_URL: ${{ vars.EXPO_PUBLIC_UPDATES_URL }}
    outputs:
      android_package: ${{ steps.identifiers.outputs.android_package }}
    steps:
      - name: Checkout validated ref
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.target_sha }}
          fetch-depth: 0
          submodules: true

      - name: Set up Node
        id: node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # file: dependencies (modules/*) install as symlinks into the checkout, so the cache holds
      # only the links; their package.json files are in the key for the dependencies they declare.
      # The vendored Markdown renderer's postinstall downloads native sources into its checkout
      # folder; they are cached alongside, as both native builds and the OTA fingerprint read them.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            modules/react-native-enriched-markdown/cpp/highlight/vendor/grammars
            modules/react-native-enriched-markdown/cpp/highlight/vendor/tree-sitter
            modules/react-native-enriched-markdown/ios/vendor
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json', 'modules/*/package.json', 'modules/react-native-enriched-markdown/*.mjs', 'modules/react-native-enriched-markdown/ratex-version.json', 'modules/react-native-enriched-markdown/cpp/highlight/grammar-versions.json') }}

      # The postinstall only warns when a download fails; an incomplete set is never cached.
      - name: Install dependencies
        id: npm-ci
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: |
          npm ci
          vendor=modules/react-native-enriched-markdown
          if [ -f "$vendor/cpp/highlight/vendor/grammars/.stamp" ] && [ -f "$vendor/cpp/highlight/vendor/tree-sitter/.stamp" ] && [ -f "$vendor/ios/vendor/.stamp" ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          fi

      # Saved before anything else runs: later steps write build output into node_modules.
      - name: Save node_modules
        if: steps.npm-ci.outputs.complete == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            node_modules
            modules/react-native-enriched-markdown/cpp/highlight/vendor/grammars
            modules/react-native-enriched-markdown/cpp/highlight/vendor/tree-sitter
            modules/react-native-enriched-markdown/ios/vendor
          key: ${{ steps.node-modules.outputs.cache-primary-key }}

      # sandboxd, the device Runtime's file bridge, is built from the pinned reference/cohub submodule.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: reference/cohub/apps/sandbox/go.mod
          cache-dependency-path: reference/cohub/apps/sandbox/go.sum

      - name: Record native fingerprint
        run: |
          set -euo pipefail
          mkdir -p build/native-release
          fingerprint=$(npx @expo/fingerprint fingerprint:generate --platform android | node -e 'let raw="";process.stdin.on("data",chunk=>raw+=chunk).on("end",()=>{const hash=String(JSON.parse(raw).hash||"").trim().toLowerCase(); if(!/^[a-f0-9]{40,64}$/.test(hash)) process.exit(1); process.stdout.write(hash)})')
          printf '%s\n' "$fingerprint" > build/native-release/cohub-android-native-fingerprint.txt

      - name: Validate source metadata
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "${{ inputs.profile }}" == "distribution" || "${{ inputs.profile }}" == "production" ]]; then
            npm run release:check -- --require-native-tag
          fi

      - name: Prepare Firebase configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.COHUB_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$GOOGLE_SERVICES_JSON_BASE64" ]]; then
            echo "No Android Firebase configuration supplied; remote push token registration will remain unavailable in this build."
          else
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > "$RUNNER_TEMP/google-services.json"
            test -s "$RUNNER_TEMP/google-services.json"
            echo "COHUB_GOOGLE_SERVICES_FILE=$RUNNER_TEMP/google-services.json" >> "$GITHUB_ENV"
            echo "Android Firebase configuration prepared."
          fi

      - name: Generate Android project
        run: npm run native:android:prepare

      # This also makes recovery builds work for tags created before the helper changed.
      - name: Configure Android release heap
        run: |
          set -euo pipefail
          gradle_properties=android/gradle.properties
          memory_args_path=scripts/android-gradle-jvmargs.txt
          if [[ ! -f "$memory_args_path" ]]; then
            memory_args_path="$RUNNER_TEMP/android-gradle-jvmargs.txt"
            git show "origin/main:scripts/android-gradle-jvmargs.txt" > "$memory_args_path"
          fi
          memory_args=$(sed -n '1p' "$memory_args_path")
          test -n "$memory_args"
          memory_line="org.gradle.jvmargs=$memory_args"
          if grep -q '^org\.gradle\.jvmargs=' "$gradle_properties"; then
            sed -i "s|^org\\.gradle\\.jvmargs=.*$|$memory_line|" "$gradle_properties"
          else
            printf '\n%s\n' "$memory_line" >> "$gradle_properties"
          fi
          grep -Fxq "$memory_line" "$gradle_properties"

      - name: Resolve Android identifier
        id: identifiers
        run: node scripts/print-native-identifiers.mjs

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # setup-java hashes the prebuild-generated android/*.gradle files into its cache key
      # and never falls back to an older entry, so every release version bump starts cold
      # (~4 minutes of re-downloaded dependencies and artifact transforms). The Gradle
      # caches only depend on the committed dependency set, which changes far less often.
      - name: Restore Gradle caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/build-cache-1
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Validate Android signing inputs
        if: inputs.profile == 'distribution' || inputs.profile == 'production'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is required for Android distribution/release builds"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD is required for Android distribution/release builds"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS is required for Android distribution/release builds"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD is required for Android distribution/release builds"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/cohub-upload.jks
          {
            echo "COHUB_ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/cohub-upload.jks"
            echo "COHUB_ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "COHUB_ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "COHUB_ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Configure Android release signing
        if: inputs.profile == 'distribution' || inputs.profile == 'production'
        run: node scripts/configure-android-signing.mjs

      # ccache serves the NDK/CMake compiles that dominate the build (React Native's own CMake
      # also finds it; the doubled launcher is harmless). Gradle installs the NDK on every run, so
      # ccache identifies the compiler by content, not mtime. Gradle's build cache serves the Kotlin
      # and Java tasks. Both restore the newest entry for this build variant and save every run.
      - name: Set up native build caches
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache
          mkdir -p ~/.gradle
          echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties
          {
            echo "CCACHE_DIR=$HOME/.ccache"
            echo "CCACHE_MAXSIZE=1G"
            echo "CCACHE_COMPILERCHECK=content"
            echo "CCACHE_SLOPPINESS=include_file_ctime,include_file_mtime,time_macros"
            echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
          } >> "$GITHUB_ENV"

      - name: Restore native build caches
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.ccache
            ~/.gradle/caches/build-cache-1
          key: android-build-${{ runner.os }}-release-${{ github.run_id }}
          restore-keys: |
            android-build-${{ runner.os }}-release-

      - name: Build signed distribution APKs
        if: inputs.profile == 'distribution'
        env:
          COHUB_ANDROID_ARCHITECTURES: armeabi-v7a,arm64-v8a,x86,x86_64
        run: npm run native:android:distribution

      - name: Build production AAB
        if: inputs.profile == 'production'
        run: npm run native:android:release

      - name: Show ccache stats
        if: success() || failure()
        run: ccache --show-stats

      # A tag run can only read its own tag's caches and main's, so a passing tag build has no later
      # reader: only a dispatch from main fills the shared entry, and a failure warms its own rerun.
      - name: Save native build caches
        if: failure() || (success() && github.ref == 'refs/heads/main')
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.ccache
            ~/.gradle/caches/build-cache-1
          key: android-build-${{ runner.os }}-release-${{ github.run_id }}

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: cohub-android-${{ inputs.profile }}-${{ github.run_id }}
          path: |
            ${{ inputs.profile == 'production' && 'android/app/build/outputs/bundle/release/app-release.aab' || 'android/app/build/outputs/apk/release/app-*-release.apk' }}
            build/native-release/cohub-android-native-fingerprint.txt
          if-no-files-found: error
          retention-days: 30

  submit-android:
    name: Submit Android to Google Play
    needs: [android, check]
    if: inputs.profile == 'production' && inputs.submit == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate Google Play submission input
        env:
          GOOGLE_PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: test -n "$GOOGLE_PLAY_JSON" || { echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is required when submit=true"; exit 1; }

      - name: Download Android artifact
        uses: actions/download-artifact@v8
        with:
          name: cohub-android-${{ inputs.profile }}-${{ github.run_id }}
          path: build/android-artifact

      - name: Submit Android to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ needs.android.outputs.android_package }}
          releaseFiles: build/android-artifact/android/app/build/outputs/bundle/release/app-release.aab
          tracks: ${{ inputs.android_track }}
          releaseName: ${{ inputs.release_tag || github.ref_name }}
          status: completed

  ios:
    name: iOS release
    needs: metadata
    if: inputs.profile == 'production' && (inputs.platform == 'all' || inputs.platform == 'ios')
    runs-on: macos-latest
    timeout-minutes: 65
    env:
      EXPO_PUBLIC_UPDATES_URL: ${{ vars.EXPO_PUBLIC_UPDATES_URL }}
    steps:
      - name: Checkout validated ref
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.target_sha }}
          fetch-depth: 0

      - name: Set up Node
        id: node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # file: dependencies (modules/*) install as symlinks into the checkout, so the cache holds
      # only the links; their package.json files are in the key for the dependencies they declare.
      # The vendored Markdown renderer's postinstall downloads native sources into its checkout
      # folder; they are cached alongside, as both native builds and the OTA fingerprint read them.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            modules/react-native-enriched-markdown/cpp/highlight/vendor/grammars
            modules/react-native-enriched-markdown/cpp/highlight/vendor/tree-sitter
            modules/react-native-enriched-markdown/ios/vendor
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json', 'modules/*/package.json', 'modules/react-native-enriched-markdown/*.mjs', 'modules/react-native-enriched-markdown/ratex-version.json', 'modules/react-native-enriched-markdown/cpp/highlight/grammar-versions.json') }}

      # The postinstall only warns when a download fails; an incomplete set is never cached.
      - name: Install dependencies
        id: npm-ci
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: |
          npm ci
          vendor=modules/react-native-enriched-markdown
          if [ -f "$vendor/cpp/highlight/vendor/grammars/.stamp" ] && [ -f "$vendor/cpp/highlight/vendor/tree-sitter/.stamp" ] && [ -f "$vendor/ios/vendor/.stamp" ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          fi

      # Saved before anything else runs: later steps write build output into node_modules.
      - name: Save node_modules
        if: steps.npm-ci.outputs.complete == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            node_modules
            modules/react-native-enriched-markdown/cpp/highlight/vendor/grammars
            modules/react-native-enriched-markdown/cpp/highlight/vendor/tree-sitter
            modules/react-native-enriched-markdown/ios/vendor
          key: ${{ steps.node-modules.outputs.cache-primary-key }}

      - name: Validate source metadata
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "${{ inputs.profile }}" == "production" ]]; then
            npm run release:check -- --require-native-tag
          fi

      # CocoaPods' download cache, mostly React Native's prebuilt frameworks. pod install still
      # resolves and generates the Pods project from node_modules on every run.
      - name: Restore CocoaPods cache
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            cocoapods-${{ runner.os }}-

      - name: Generate iOS project and install pods
        run: npm run native:ios:prepare

      - name: Resolve iOS identifier
        id: identifiers
        run: node scripts/print-native-identifiers.mjs

      - name: Validate iOS signing inputs
        if: inputs.profile == 'production'
        env:
          ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          TEAM_ID: ${{ vars.APPSTORE_TEAM_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          CERTIFICATE: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ISSUER_ID" || { echo "APPSTORE_ISSUER_ID repository variable is required"; exit 1; }
          test -n "$API_KEY_ID" || { echo "APPSTORE_API_KEY_ID repository variable is required"; exit 1; }
          test -n "$TEAM_ID" || { echo "APPSTORE_TEAM_ID repository variable is required"; exit 1; }
          test -n "$PRIVATE_KEY" || { echo "APPSTORE_API_PRIVATE_KEY secret is required"; exit 1; }
          test -n "$CERTIFICATE" || { echo "APPSTORE_CERTIFICATES_FILE_BASE64 secret is required"; exit 1; }
          test -n "$CERTIFICATE_PASSWORD" || { echo "APPSTORE_CERTIFICATES_PASSWORD secret is required"; exit 1; }
          {
            echo "IOS_TEAM_ID=$TEAM_ID"
            echo "APPSTORE_ISSUER_ID=$ISSUER_ID"
            echo "APPSTORE_API_KEY_ID=$API_KEY_ID"
          } >> "$GITHUB_ENV"

      - name: Import iOS distribution certificate
        if: inputs.profile == 'production'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Download iOS provisioning profile
        if: inputs.profile == 'production'
        id: profiles
        uses: apple-actions/download-provisioning-profiles@v7
        with:
          bundle-id: ${{ steps.identifiers.outputs.ios_bundle_id }}
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Resolve provisioning profile name
        if: inputs.profile == 'production'
        env:
          PROFILES_JSON: ${{ steps.profiles.outputs.profiles }}
        run: |
          profile_name=$(node -e 'const profiles = JSON.parse(process.env.PROFILES_JSON); if (!profiles[0]?.name) process.exit(1); process.stdout.write(profiles[0].name)')
          echo "IOS_PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"

      - name: Build production IPA
        if: inputs.profile == 'production'
        run: npm run native:ios:release

      # Publish OTA resolves the iOS runtime from this file, mirroring assets/fingerprint in the Android APK.
      - name: Record iOS OTA fingerprint
        run: |
          set -euo pipefail
          mkdir -p build/native-release
          unzip -q build/export/Cohub.ipa -d "$RUNNER_TEMP/ios-ipa"
          fingerprint_file=$(find "$RUNNER_TEMP/ios-ipa" -type f -path '*EXUpdates.bundle*' -name fingerprint -print -quit)
          test -n "$fingerprint_file" || { echo "The built IPA does not embed an Expo Updates fingerprint. Confirm expo-updates is included in the iOS build."; exit 1; }
          fingerprint=$(tr -d '[:space:]' < "$fingerprint_file" | tr 'A-F' 'a-f')
          if [[ ! "$fingerprint" =~ ^[a-f0-9]{40,64}$ ]]; then
            echo "The built IPA embeds an invalid Expo Updates fingerprint: $fingerprint"
            exit 1
          fi
          printf '%s\n' "$fingerprint" > build/native-release/cohub-ios-native-fingerprint.txt
          echo "Recorded iOS OTA fingerprint $fingerprint"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: cohub-ios-${{ inputs.profile }}-${{ github.run_id }}
          path: |
            build/export/Cohub.ipa
            build/native-release/cohub-ios-native-fingerprint.txt
          if-no-files-found: error
          retention-days: 30

  submit-ios:
    name: Submit iOS to TestFlight
    needs: [ios, check]
    if: inputs.profile == 'production' && inputs.submit == true
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Download iOS artifact
        uses: actions/download-artifact@v8
        with:
          name: cohub-ios-${{ inputs.profile }}-${{ github.run_id }}
          path: build/ios-artifact

      # The artifact keeps the layout under build/: export/Cohub.ipa and native-release/.
      - name: Submit iOS to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: build/ios-artifact/export/Cohub.ipa
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          wait-for-processing: "true"

  attach-ios-fingerprint:
    name: Attach iOS OTA fingerprint
    needs: submit-ios
    if: inputs.submit == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download iOS artifact
        uses: actions/download-artifact@v8
        with:
          name: cohub-ios-${{ inputs.profile }}-${{ github.run_id }}
          path: build/ios-artifact

      # Only a submitted TestFlight build is distributed, so only its fingerprint may claim the release's iOS runtime.
      - name: Upload fingerprint to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          fingerprint=$(find build/ios-artifact -type f -name cohub-ios-native-fingerprint.txt -print -quit)
          test -n "$fingerprint" || { echo "The iOS artifact is missing cohub-ios-native-fingerprint.txt."; exit 1; }
          gh release upload "$RELEASE_TAG" "$fingerprint" --repo "$GITHUB_REPOSITORY" --clobber
